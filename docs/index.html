<!doctype html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#EDEFF2; --surface:#FFFFFF; --surface-2:#F5F7F9;
    --ink:#191D23; --muted:#59636F; --line:#D6DBE1;
    --amber:#9E2A2B; --amber-soft:#F2DCDC;
    --teal:#3F5873; --teal-soft:#DDE4EC;
    --rust:#9C3B2E; --rust-soft:#F2DFDB;
    --display:"Zilla Slab",Georgia,serif;
    --body:"Source Sans 3",system-ui,-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sp:clamp(16px,3vw,28px);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#13161A; --surface:#1B1F25; --surface-2:#22272E;
      --ink:#E4E8ED; --muted:#939DA9; --line:#2E353E;
      --amber:#E07A73; --amber-soft:#3A1E1E;
      --teal:#8FA8C4; --teal-soft:#1D2733;
      --rust:#D4776A; --rust-soft:#3A221E;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#13161A; --surface:#1B1F25; --surface-2:#22272E;
    --ink:#E4E8ED; --muted:#939DA9; --line:#2E353E;
    --amber:#E07A73; --amber-soft:#3A1E1E;
    --teal:#8FA8C4; --teal-soft:#1D2733;
    --rust:#D4776A; --rust-soft:#3A221E;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--body); font-size:16px; line-height:1.6;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  img{max-width:100%}
  a{color:inherit}
  h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0; font-weight:600}
  code{font-family:var(--mono); font-size:.92em; background:var(--surface-2); padding:1px 5px; border-radius:3px}

  .shell{display:grid; grid-template-columns:270px minmax(0,1fr)}
  @media (max-width:820px){ .shell{grid-template-columns:minmax(0,1fr)} }

  .rail{
    border-right:1px solid var(--line); background:var(--surface);
    padding:var(--sp) 0 48px; position:sticky; top:env(safe-area-inset-top,0px);
    align-self:start; max-height:100vh; overflow-y:auto;
  }
  @media (max-width:820px){
    .rail{position:static; max-height:none; border-right:0; border-bottom:1px solid var(--line); padding-bottom:20px}
  }
  .brand{padding:0 20px 18px; border-bottom:1px solid var(--line); margin-bottom:14px}
  .brand .ship{font-family:var(--display); font-size:21px; font-weight:700; line-height:1.15; letter-spacing:-.01em}
  .brand .sub{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:7px}

  .search{margin:0 20px 16px}
  .search input{
    width:100%; padding:8px 11px; border-radius:7px; font-family:var(--body); font-size:14px;
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
  }
  .search input:focus{outline:2px solid var(--amber); outline-offset:1px}

  .grp{margin-bottom:16px}
  .grp > .lbl{font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); padding:0 20px; margin-bottom:5px}
  .nav a{display:flex; align-items:baseline; gap:8px; justify-content:space-between; padding:5px 20px; text-decoration:none; font-size:14.5px; border-left:2px solid transparent}
  .nav a:hover{background:var(--surface-2)}
  .nav a[aria-current="page"]{border-left-color:var(--amber); background:var(--surface-2); font-weight:600}
  .nav a:focus-visible{outline:2px solid var(--amber); outline-offset:-2px}
  .nav a .n{font-family:var(--mono); font-size:10.5px; color:var(--muted)}

  main{padding:var(--sp); padding-block:calc(var(--sp) + 6px) 90px; max-width:820px}
  .crumb{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
  .ttl{font-size:clamp(28px,5vw,40px); line-height:1.08; letter-spacing:-.02em; margin-bottom:6px}
  .dek{color:var(--muted); font-size:17px; margin-bottom:22px}

  .badges{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px}
  .tag{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:4px; background:var(--surface-2); color:var(--muted); border:1px solid var(--line)}
  .tag.t-character{background:var(--teal-soft); color:var(--teal); border-color:transparent}
  .tag.t-place{background:var(--amber-soft); color:var(--amber); border-color:transparent}
  .tag.t-faction{background:var(--rust-soft); color:var(--rust); border-color:transparent}
  .tag.t-enemy{background:var(--rust-soft); color:var(--rust); border-color:transparent}
  .conf{display:inline-flex; align-items:center; gap:5px}
  .dot{width:7px; height:7px; border-radius:50%; display:inline-block}
  .dot.hi{background:var(--teal)} .dot.mid{background:var(--amber)} .dot.lo{background:var(--rust)}

  .prose p{margin:0 0 15px}
  .prose h2{font-size:15px; letter-spacing:.02em; margin:30px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line)}
  .prose ul{margin:0 0 16px; padding-left:20px}
  .prose li{margin-bottom:7px}
  .prose em{color:var(--muted)}

  a.wl{color:var(--teal); text-decoration:none; border-bottom:1px solid color-mix(in srgb, var(--teal) 35%, transparent); padding-bottom:.5px}
  a.wl:hover{border-bottom-color:var(--teal); background:var(--teal-soft)}
  a.wl.missing{color:var(--rust); border-bottom-style:dotted; border-bottom-color:var(--rust)}

  .panel{border:1px solid var(--line); border-radius:9px; background:var(--surface); padding:16px 18px; margin:0 0 18px}
  .panel .ph{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:9px}
  .panel p{margin:0}
  .panel.note{background:var(--surface-2)}
  .panel.warn{border-left:3px solid var(--rust)}

  .alias{display:inline-block; font-family:var(--mono); font-size:11.5px; padding:2px 7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); margin:0 4px 4px 0; color:var(--muted)}

  .backlinks{margin-top:34px; padding-top:16px; border-top:1px solid var(--line)}
  .backlinks .ph{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
  .backlinks ul{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px}
  .backlinks li a{font-size:13.5px; text-decoration:none; padding:3px 9px; border-radius:5px; background:var(--surface-2); border:1px solid var(--line)}
  .backlinks li a:hover{border-color:var(--teal); color:var(--teal)}

  .thread{border-left:2px solid var(--line); padding:0 0 2px 15px; margin-bottom:20px}
  .thread.open{border-left-color:var(--amber)}
  .thread.hot{border-left-color:var(--rust)}
  .thread h3{font-size:16.5px; margin-bottom:3px}
  .thread .st{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:5px}
  .thread p{margin:0; font-size:15px}

  .beat{display:grid; grid-template-columns:70px minmax(0,1fr); gap:14px; margin-bottom:16px}
  .timeline-session{font-size:20px!important; margin:32px 0 16px!important; padding-bottom:7px!important; border-bottom:1px solid var(--line)!important}
  .timeline-session:first-child{margin-top:4px!important}
  @media (max-width:520px){ .beat{grid-template-columns:minmax(0,1fr); gap:2px} }
  .beat .t{font-family:var(--mono); font-size:11.5px; color:var(--muted); padding-top:4px}
  .beat .b p{margin:2px 0 0; font-size:14.5px; color:var(--muted)}

  .foot{margin-top:44px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; color:var(--muted)}

  .themebtn{
    position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px));
    border:1px solid var(--line); background:var(--surface); color:var(--muted);
    font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    padding:7px 11px; border-radius:6px; cursor:pointer;
  }
  .themebtn:hover{color:var(--ink); border-color:var(--amber)}
  @media (prefers-reduced-motion:no-preference){ .nav a,a.wl,.backlinks li a{transition:background .12s,color .12s,border-color .12s} }
</style>
</head>

<script>
const PAGES  = [{"id": "overview", "title": "Campaign Overview", "group": "Campaign", "type": "doc", "typeLabel": "Session", "layout": "prose", "dek": "Where the party stands at the end of Session 2.", "conf": "", "confLabel": "", "player": "", "aliases": [], "html": "<p>The heroes set out from <a class=\"wl\" href=\"#broadhurst\">Broadhurst</a> for <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>. Getting in did not go cleanly: the party was split at the gates, and <a class=\"wl\" href=\"#urzel-the-radiant\">Urzel</a> was only brought inside after the others murdered members of the <a class=\"wl\" href=\"#ashgate-watch\">Ashgate Watch</a>.</p><h2>Current Position</h2><p>The party escaped the Watch through the back alleys and found <a class=\"wl\" href=\"#annabel-swordbuck\">Annabel Swordbuck</a> in a smuggler's bolt hole. That is where Session 2 ended.</p><h2>The Heroes</h2><ul><li><a class=\"wl\" href=\"#aurelion\">Aurelion</a> — human censor, a former watch officer.</li><li><a class=\"wl\" href=\"#bertrude\">Bertrude</a> — human telepath, a disavowed agent.</li><li><a class=\"wl\" href=\"#malthazar\">Malthazar</a> — dragon knight shadow with a criminal past.</li><li><a class=\"wl\" href=\"#torr\">Torr</a> — high elf tactician raised among the Wode Elves.</li><li><a class=\"wl\" href=\"#urzel-the-radiant\">Urzel the Radiant</a> — orc conduit of Life and Sun.</li></ul><p>Session-by-session detail is in the recaps, the cumulative <a class=\"wl\" href=\"#timeline\">Campaign Timeline</a> and the <a class=\"wl\" href=\"#threads\">Open Threads</a> page.</p>", "backlinks": [], "search": "campaign overview where the party stands at the end of session 2."}, {"id": "timeline", "title": "Campaign Timeline", "group": "Campaign", "type": "doc", "typeLabel": "Session", "layout": "timeline", "dek": "Session beats in order.", "conf": "", "confLabel": "", "player": "", "aliases": [], "html": "<h2 class=\"timeline-session\">Session 1</h2><div class=\"beat\"><div class=\"t\">1</div><div class=\"b\"><strong>Departure</strong><p>The party leaves <a class=\"wl\" href=\"#broadhurst\">Broadhurst</a> for <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>.</p></div></div><div class=\"beat\"><div class=\"t\">2</div><div class=\"b\"><strong>Refugees</strong><p>Hopeful refugees on the road to Sanctuary City.</p></div></div><div class=\"beat\"><div class=\"t\">3</div><div class=\"b\"><strong>The gates</strong><p>The party is interrogated at the gates and split up.</p></div></div><div class=\"beat\"><div class=\"t\">4</div><div class=\"b\"><strong>Something is off</strong><p>Inside Sanctuary City, something is not right.</p></div></div><div class=\"beat\"><div class=\"t\">5</div><div class=\"b\"><strong>The side gate</strong><p>A scene at a side gate into the city.</p></div></div><div class=\"beat\"><div class=\"t\">6</div><div class=\"b\"><strong>Getting Urzel in</strong><p><a class=\"wl\" href=\"#the-tail-and-claw\">The Tail and Claw</a>, criminal elements, stolen uniforms, and members of the <a class=\"wl\" href=\"#ashgate-watch\">Ashgate Watch</a> murdered to sneak <a class=\"wl\" href=\"#urzel-the-radiant\">Urzel</a> in.</p></div></div><h2 class=\"timeline-session\">Session 2</h2><div class=\"beat\"><div class=\"t\">1</div><div class=\"b\"><strong>Alarm bells</strong><p>The Watch is alerted and the party flees into the back alleys.</p></div></div><div class=\"beat\"><div class=\"t\">2</div><div class=\"b\"><strong>The chase</strong><p>The party escapes the Ashgate Watch.</p></div></div><div class=\"beat\"><div class=\"t\">3</div><div class=\"b\"><strong>The bolt hole</strong><p><a class=\"wl\" href=\"#annabel-swordbuck\">Annabel Swordbuck</a> is found in a smuggler's bolt hole.</p></div></div>", "backlinks": ["overview"], "search": "campaign timeline session beats in order."}, {"id": "threads", "title": "Open Threads", "group": "Campaign", "type": "doc", "typeLabel": "Session", "layout": "threads", "dek": "What the party is carrying unresolved after Session 2.", "conf": "", "confLabel": "", "player": "", "aliases": [], "html": "<div class=\"thread hot\"><div class=\"st\">Hunting the party</div><h3>The Ashgate Watch</h3><p>The party murdered members of the <a class=\"wl\" href=\"#ashgate-watch\">Ashgate Watch</a> to get <a class=\"wl\" href=\"#urzel-the-radiant\">Urzel</a> into the city. The rest of the Watch was alerted, and the party escaped them for now.</p></div><div class=\"thread open\"><div class=\"st\">Just met</div><h3>Annabel Swordbuck</h3><p><a class=\"wl\" href=\"#annabel-swordbuck\">Annabel</a> was found in a smuggler's bolt hole at the end of Session 2.</p></div><div class=\"thread open\"><div class=\"st\">Unexplained</div><h3>Something is off in Sanctuary City</h3><p>The party sensed something wrong in <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a> soon after arriving.</p></div>", "backlinks": ["overview"], "search": "open threads what the party is carrying unresolved after session 2."}, {"id": "session-1", "title": "Session 1 — The Road to Sanctuary", "group": "Sessions", "type": "doc", "typeLabel": "Session", "layout": "prose", "dek": "Session recap — safe to share with the table.", "conf": "", "confLabel": "", "player": "", "aliases": [], "html": "<h2>Leaving Broadhurst</h2><p>The party set out from <a class=\"wl\" href=\"#broadhurst\">Broadhurst</a>, bound for <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>.</p><h2>Refugees on the Road</h2><p>On the road they fell in with refugees heading the same way, hopeful of what they would find in Sanctuary City.</p><h2>The Gates</h2><p>At the city gates the party was interrogated and split up.</p><h2>Something Is Off</h2><p>Inside, something about <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a> did not sit right.</p><h2>The Side Gate</h2><p>The party played out a scene at a side gate into the city.</p><h2>Getting Urzel In</h2><p>The party found <a class=\"wl\" href=\"#the-tail-and-claw\">the Tail and Claw</a> and interacted with the city's criminal elements. They stole some uniforms, and they murdered members of the <a class=\"wl\" href=\"#ashgate-watch\">Ashgate Watch</a> in order to sneak <a class=\"wl\" href=\"#urzel-the-radiant\">Urzel</a> into the city.</p>", "backlinks": [], "search": "session 1 — the road to sanctuary session recap — safe to share with the table."}, {"id": "session-2", "title": "Session 2 — Into the Alleys", "group": "Sessions", "type": "doc", "typeLabel": "Session", "layout": "prose", "dek": "Session recap — safe to share with the table.", "conf": "", "confLabel": "", "player": "", "aliases": [], "html": "<h2>Alarm Bells</h2><p>The killings did not go unnoticed. Alarm bells rang, the rest of the <a class=\"wl\" href=\"#ashgate-watch\">Ashgate Watch</a> was alerted, and the party fled into the back alleys of <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>.</p><h2>Through the Back Alleys</h2><p>A chase through the alleys followed, and the party escaped the Watch.</p><h2>The Bolt Hole</h2><p>The party found <a class=\"wl\" href=\"#annabel-swordbuck\">Annabel Swordbuck</a> in a smuggler's bolt hole.</p>", "backlinks": [], "search": "session 2 — into the alleys session recap — safe to share with the table."}, {"id": "aurelion", "title": "Aurelion", "group": "Heroes", "type": "hero", "typeLabel": "Hero", "layout": "prose", "dek": "Human censor of the Paragon order, once a watch officer. Level 2.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "html": "<h2>At a Glance</h2><ul><li><strong>Ancestry:</strong> Human</li><li><strong>Class:</strong> Censor — Paragon order, Fate domain</li><li><strong>Career:</strong> Watch Officer</li><li><strong>Culture:</strong> Human — urban, communal, labor upbringing</li><li><strong>Level:</strong> 2 · Wealth 1 · Renown 0</li></ul><h2>Characteristics</h2><ul><li><strong>Might</strong> 2 · <strong>Agility</strong> −1 · <strong>Reason</strong> 1 · <strong>Intuition</strong> 1 · <strong>Presence</strong> 2</li><li><strong>Stamina</strong> 39 (winded at 19) · <strong>Recoveries</strong> 14, recovering 13 Stamina each</li><li><strong>Speed</strong> 5 · <strong>Size</strong> 1M · <strong>Stability</strong> 2 · <strong>Disengage</strong> 1</li><li><strong>Heroic resource:</strong> Wrath</li><li><strong>Kit:</strong> Mountain — heavy weapon, heavy armor (+4 melee damage at tier 3)</li></ul><h2>Inciting Incident — Powerful Enemies</h2><p>Aurelion made it their responsibility to root out and bring down the region's foremost crime syndicate. The syndicate sent goons to burn down their home and teach them a lesson, leaving them bleeding in the street with nothing left but their life. They have since taken on the life of a hero to gain the power and influence needed to destroy the syndicate once and for all.</p><h2>Languages</h2><p>Caelian, Szetch, Vaslorian, Zaliac.</p><h2>Skills</h2><p>Climb, Endurance, Jump, Lift, Lead, Intimidate, Read Person, Search, Religion.</p><h2>Traits and Perks</h2><ul><li><strong>Detect the Supernatural</strong> and <strong>Resist the Unnatural</strong> — human ancestry traits; <strong>Staying Power</strong> grants +2 Recoveries.</li><li><strong>Team Leader</strong> — spend a hero token at the start of a group or montage test so every participant tests as if they had the hero's exploration skills.</li><li><strong>Engrossing Monologue</strong> — outside combat, shout to hold the attention of non-hostile creatures within 10 squares; allies gain an edge to avoid being noticed while they listen.</li></ul><h2>Class Features</h2><ul><li><strong>Judgment</strong> — a prayer that outlines a foe in holy energy and punishes it for acting.</li><li><strong>My Life for Yours</strong> — spend a Recovery to let yourself or an ally regain Stamina.</li><li><strong>Lead by Example</strong> and <strong>Stalwart Example</strong> — the gods' favour helps allies flank and aids tests to intimidate or persuade.</li></ul><h2>Abilities</h2><ul><li><strong>Pain for Pain</strong> (signature) — \"An enemy who tagged you will pay for that.\"</li><li><strong>Your Allies Cannot Save You!</strong> (signature) — a holy strike that shoves the target's adjacent allies away.</li><li><strong>The Gods Punish and Defend</strong> (3 Wrath) — smite a foe and heal an ally.</li><li><strong>Arrest</strong> (5 Wrath) — \"I got you, you son of a bitch.\"</li><li><strong>Blessing of the Faithful</strong> (5 Wrath) — an aura granting surges to allies.</li></ul>", "backlinks": ["overview"], "search": "aurelion human censor of the paragon order, once a watch officer. level 2."}, {"id": "bertrude", "title": "Bertrude", "group": "Heroes", "type": "hero", "typeLabel": "Hero", "layout": "prose", "dek": "Human telepath and disavowed agent. Level 2.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": [], "html": "<div class=\"panel note\"><div class=\"ph\">Name on the sheet</div><p>The character name field on the Forge Steel sheet is blank. \"Bertrude\" comes from the file name and the campaign notes.</p></div><h2>At a Glance</h2><ul><li><strong>Ancestry:</strong> Human</li><li><strong>Class:</strong> Talent — Telepathy tradition</li><li><strong>Career:</strong> Agent</li><li><strong>Culture:</strong> Bespoke — secluded, bureaucratic, academic upbringing</li><li><strong>Level:</strong> 2 · Wealth 1 · Renown 0</li></ul><h2>Characteristics</h2><ul><li><strong>Might</strong> −1 · <strong>Agility</strong> 1 · <strong>Reason</strong> 2 · <strong>Intuition</strong> 1 · <strong>Presence</strong> 2</li><li><strong>Stamina</strong> 24 (winded at 12) · <strong>Recoveries</strong> 10, recovering 8 Stamina each</li><li><strong>Speed</strong> 5 · <strong>Size</strong> 1M · <strong>Stability</strong> 0 · <strong>Disengage</strong> 1</li><li><strong>Heroic resource:</strong> Clarity</li><li><strong>Augmentation:</strong> Distance Augmentation (+2 distance to ranged psionic abilities)</li><li><strong>Ward:</strong> Repulsive Ward</li></ul><h2>Inciting Incident — Disavowed</h2><p>On a dangerous espionage assignment, things went sideways. Bertrude escaped with their life, but the mission was a public failure thanks to bad information their agency gave them. The agency denied they worked for it, and Bertrude went on the run. Hero work will let them survive and clear their name.</p><h2>Languages</h2><p>Caelian, Hyrallic, Mindspeech, Vaslorian, Yllyric.</p><h2>Skills</h2><p>Empathize, Flirt, Lie, Persuade, Disguise, Search, Sneak, Magic, Psionics, Timescape.</p><h2>Traits and Perks</h2><ul><li><strong>Detect the Supernatural</strong> and <strong>Resist the Unnatural</strong> — human ancestry traits; <strong>Staying Power</strong> grants +2 Recoveries.</li><li><strong>Forgettable Face</strong> — after ten minutes or less with someone new, they can be made to forget your face; disguises come easily.</li></ul><h2>Class Features</h2><ul><li><strong>Telepathic Speech</strong> — speak mind to mind with any creature within Mind Spike's range that shares a language.</li><li><strong>Ease the Mind</strong> — an edge on tests to stop combat and start a negotiation, and hostile or suspicious NPCs have more patience.</li><li><strong>Mind Spike</strong> — a telepathic bolt that instantly zaps a creature's brain.</li><li><strong>Remote Assistance</strong> — an ally gains the benefit of your intellect.</li><li><strong>Feedback Loop</strong> — a brief psychic link gives an enemy a taste of its own medicine.</li></ul><h2>Abilities</h2><ul><li><strong>Kinetic Grip</strong> (signature) — lift and hurl a foe away.</li><li><strong>Kinetic Pulse</strong> (signature) — the force of your mind hurls enemies backward.</li><li><strong>Awe</strong> (3 Clarity) — project psionic energy and take on a new visage in a creature's mind.</li><li><strong>Flashback</strong> (5 Clarity) — throw a target several seconds back through time so it can act again.</li></ul>", "backlinks": ["overview"], "search": "bertrude human telepath and di const TITLES = {"annabel-swordbuck": "Annabel Swordbuck", "ashgate-watch": "Ashgate Watch", "aurelion": "Aurelion", "bertrude": "Bertrude", "broadhurst": "Broadhurst", "malthazar": "Malthazar", "overview": "Campaign Overview", "sanctuary-city": "Sanctuary City", "session-1": "Session 1 — The Road to Sanctuary", "session-2": "Session 2 — Into the Alleys", "the-tail-and-claw": "The Tail and Claw", "threads": "Open Threads", "timeline": "Campaign Timeline", "torr": "Torr", "urzel-the-radiant": "Urzel the Radiant"};
const BUILT  = "2026-10-07";
const byId = Object.fromEntries(PAGES.map(p => [p.id, p]));
let current = PAGES.length ? PAGES[0].id : "";

const main = document.getElementById("main");
const nav  = document.getElementById("nav");
const q    = document.getElementById("q");

function esc(value){
  return String(value == null ? "" : value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderPage(id){
  const p = byId[id];
  if(!p) return "<p>Page not found.</p>";
  let h = '<div class="crumb">' + p.group + '</div>';
  h += '<h1 class="ttl">' + p.title + '</h1>';
  if(p.dek) h += '<div class="dek">' + p.dek + '</div>';

  if(p.type !== "doc"){
    h += '<div class="badges"><span class="tag t-' + p.type + '">' + p.typeLabel + '</span>';
    if(p.player) h += '<span class="tag">Played by ' + p.player + '</span>';
    if(p.conf)   h += '<span class="tag"><span class="conf"><span class="dot ' + p.conf + '"></span>' + p.confLabel + '</span></span>';
    h += '</div>';
    if(p.aliases.length){
      h += '<div class="panel"><div class="ph">Also transcribed as</div><div>'
         + p.aliases.map(a => '<span class="alias">' + a + '</span>').join('')
         + '</div></div>';
    }
  }

  h += '<div class="prose">' + p.html + '</div>';

  if(p.backlinks.length){
    h += '<div class="backlinks"><div class="ph">Mentioned in</div><ul>'
       + p.backlinks.map(b => '<li><a href="#' + b + '">' + TITLES[b] + '</a></li>').join('')
       + '</ul></div>';
  }

  h += '<div class="foot">Built from campaign records and session notes. Entity names carry every known spelling; '
     + 'anything marked <em>needs review</em> or <em>low confidence</em> is waiting on confirmation before it becomes canon. '
     + 'Built ' + BUILT + '.</div>';
  return h;
}

function renderNav(filter){
  const f = (filter || "").trim().toLowerCase();
  const groups = [];
  PAGES.forEach(p => {
    if(f && p.search.indexOf(f) === -1) return;
    let g = groups.find(x => x.name === p.group);
    if(!g){ g = {name:p.group, items:[]}; groups.push(g); }
    g.items.push(p);
  });
  if(!groups.length) return '<div style="padding:4px 20px;color:var(--muted);font-size:14px">Nothing matches.</div>';
  return groups.map(g =>
    '<div class="grp"><div class="lbl">' + g.name + '</div>'
    + g.items.map(p =>
        '<a href="#' + p.id + '"' + (p.id === current ? ' aria-current="page"' : '') + '>'
        + '<span>' + p.title + '</span>'
        + (p.type !== "doc" && p.backlinks.length ? '<span class="n">' + p.backlinks.length + '</span>' : '')
        + '</a>').join('')
    + '</div>').join('');
}

function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  current = byId[id] ? id : (PAGES.length ? PAGES[0].id : "");
  main.innerHTML = renderPage(current);
  nav.innerHTML = renderNav(q.value);
  document.title = (byId[current] ? byId[current].title + " · " : "") + "Sanctuary City";
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
q.addEventListener("input", function(){ nav.innerHTML = renderNav(q.value); });

document.getElementById("themebtn").addEventListener("click", function(){
  const root = document.documentElement;
  const now = root.getAttribute("data-theme");
  const dark = now ? now === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.setAttribute("data-theme", dark ? "light" : "dark");
  try { localStorage.setItem("ds-theme", dark ? "light" : "dark"); } catch(e){}
});
try {
  const saved = localStorage.getItem("ds-theme");
  if(saved) document.documentElement.setAttribute("data-theme", saved);
} catch(e){}

route();
</script>
