-square", "title": "Grain Square", "group": "Places", "type": "place", "typeLabel": "Place", "layout": "prose", "dek": "A square in Sanctuary City where a huge statue of Idra Voss is going up.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": [], "image": "", "html": "<p>A square in <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>. A statue of <a class=\"wl\" href=\"#idra-voss\">High Chancellor Idra Voss</a> is being built there, and its sheer size shows how much she cares about her legacy. <a class=\"wl\" href=\"#annabel-swordbuck\">Annabel</a> and <a class=\"wl\" href=\"#malthazar\">Malthazar</a> turned this up while scouting in <a class=\"wl\" href=\"#session-4\">Session 4</a>, and the party used it to win her over.</p>", "backlinks": ["annabel-swordbuck", "timeline", "idra-voss", "sanctuary-city", "session-4"], "search": "grain square a square in sanctuary city where a huge statue of idra voss is going up."}, {"id": "sanctuary-city", "title": "Sanctuary City", "group": "Places", "type": "place", "typeLabel": "Place", "layout": "prose", "dek": "A city ruled by a greedy Economic Council, and under assault by demons.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "image": "", "html": "<p>The city the party travelled to from <a class=\"wl\" href=\"#broadhurst\">Broadhurst</a>. Refugees on the road were heading there in hope. The party was interrogated at its gates, and once inside found that something did not seem right.</p><p>The <a class=\"wl\" href=\"#ashgate-watch\">Ashgate Watch</a> operates there. <a class=\"wl\" href=\"#the-tail-and-claw\">The Tail and Claw</a> is in the city.</p><h2>Beneath the City</h2><p>The sewers are something the city's smugglers no longer trust, because groups sent down don't come back. In <a class=\"wl\" href=\"#session-3\">Session 3</a> the party found out why: <a class=\"wl\" href=\"#the-cistern\">a cistern</a> full of <a class=\"wl\" href=\"#demons\">Demons</a>. Sanctuary City is under assault by demons, which explains the empty sewers, the strange bodies being pulled out of the canals, and why everything in the city has gone astray.</p><h2>Who Rules It</h2><p>Sanctuary City is ruled by the <a class=\"wl\" href=\"#economic-council\">Economic Council</a> from <a class=\"wl\" href=\"#the-commerce-hall\">the Commerce Hall</a> at its centre. The council's head is <a class=\"wl\" href=\"#idra-voss\">High Chancellor Idra Voss</a>, and <a class=\"wl\" href=\"#brannoch-hale\">Brannoch Hale</a> commands the <a class=\"wl\" href=\"#ashgate-watch\">Ashgate Watch</a>. The faith tied to the city's economy is <a class=\"wl\" href=\"#the-gilded-scale\">the Gilded Scale</a>. A huge statue of Idra Voss is going up in <a class=\"wl\" href=\"#grain-square\">Grain Square</a>.</p><h2>The Truth of It</h2><p>In <a class=\"wl\" href=\"#session-4\">Session 4</a>, Idra Voss confessed to the party in private that she signed a deal with a demon, <a class=\"wl\" href=\"#harkonex\">Harkonex</a>, seasons ago to save the city from ruin and starvation. The demon has proved insatiable. She can't admit it in public.</p><h2>The City on Fire</h2><p>On the night after the party came up from the sewers, hooded figures attacked churches and holy sites across the city. There was talk of cult activity, fires everywhere and thick smoke, and a Watch struggling to keep its grip.</p>", "backlinks": ["annabel-swordbuck", "ashgate-watch", "brannoch-hale", "broadhurst", "overview", "timeline", "economic-council", "grain-square", "harkonex", "idra-voss", "hugh", "lucan-fairweather", "threads", "orsolya-venn", "session-1", "session-2", "session-3", "session-4", "the-cistern", "the-commerce-hall", "the-gilded-scale", "the-tail-and-claw"], "search": "sanctuary city a city ruled by a greedy economic council, and under assault by demons."}, {"id": "the-cistern", "title": "The Cistern", "group": "Places", "type": "place", "typeLabel": "Place", "layout": "prose", "dek": "A sewer nexus beneath Sanctuary City, overrun by demons.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "image": "", "html": "<p>A large cistern at a junction of the sewers under <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>, crossed by boardwalks and a catwalk and full of knee-deep and deeper water. The party fought a horde of <a class=\"wl\" href=\"#demons\">Demons</a> here in <a class=\"wl\" href=\"#session-3\">Session 3</a>.</p><h2>What the Party Found</h2><ul><li><strong>The edge.</strong> At the centre, the water pours into a sinkhole that looks like a pit into another world. Bodies drift over it and vanish.</li><li><strong>The bodies.</strong> A ledge holds an enormous mound of corpses, apparently being prepared to go over the edge. <a class=\"wl\" href=\"#the-mawblade\">The Mawblade</a> was found among them.</li><li><strong>The controls.</strong> Sluice controls can close the grates and drain the cistern. <a class=\"wl\" href=\"#urzel-the-radiant\">Urzel</a> used them.</li></ul><p>A voice from the centre of the cistern ordered the demons to \"finish these fools\".</p>", "backlinks": ["annabel-swordbuck", "bendrak", "overview", "timeline", "demons", "fiktin", "frenzied", "threads", "pitling", "ruinant", "sanctuary-city", "session-3", "the-mawblade", "torlas"], "search": "the cistern a sewer nexus beneath sanctuary city, overrun by demons."}, {"id": "the-commerce-hall", "title": "The Commerce Hall", "group": "Places", "type": "place", "typeLabel": "Place", "layout": "prose", "dek": "The walled seat of the Economic Council at the heart of Sanctuary City.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": ["Commerce Centre", "Commerce Center"], "image": "", "html": "<p>The seat of the <a class=\"wl\" href=\"#economic-council\">Economic Council</a>, in the centre of <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>. It's also called the Commerce Centre and serves as the city's town hall. It is a large, multi-storey bureaucratic mansion inside a walled, gated compound, and extremely wealthy-looking. The <a class=\"wl\" href=\"#ashgate-watch\">Ashgate Watch</a> guard it heavily, and security has been raised because of the vagrants and miscreants loose in the city.</p><p>Inside, the massive doors open onto stairs, corridors and layer after layer of bureaucracy. A little servant in a vest plays a trumpet as visitors walk past. At the top is the inner sanctum where the council meets. It's a candlelit chamber with an ornate clock on the wall, full of attendants carrying scrolls and wine, with elite guards at the doors.</p><p>The party talked its way in during <a class=\"wl\" href=\"#session-4\">Session 4</a>.</p>", "backlinks": ["ashgate-watch", "overview", "timeline", "economic-council", "idra-voss", "sanctuary-city", "session-4", "the-mawblade"], "search": "the commerce hall commerce centre commerce center the walled seat of the economic council at the heart of sanctuary city."}, {"id": "the-tail-and-claw", "title": "The Tail and Claw", "group": "Places", "type": "place", "typeLabel": "Place", "layout": "prose", "dek": "A well-known inn in Sanctuary City, and the party's base of operations.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": ["Tail and Claw Inn", "Tail and Claw", "Talon Claw"], "image": "", "html": "<p>The party found the Tail and Claw during Session 1 in <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>.</p><p>It has since become the party's base of operations, the place to regroup when they get separated. In <a class=\"wl\" href=\"#session-4\">Session 4</a>, <a class=\"wl\" href=\"#torr\">Torr</a> and <a class=\"wl\" href=\"#bertrude\">Bertrude</a> waited there until the others came back from the sewers, filthy and stinking.</p><p>The barkeep has opinions. He reckons the <a class=\"wl\" href=\"#economic-council\">Economic Council</a> is a greedy bunch, but that if anyone can get an audience with them, it's this party.</p>", "backlinks": ["annabel-swordbuck", "overview", "timeline", "economic-council", "threads", "sanctuary-city", "session-1", "session-4"], "search": "the tail and claw tail and claw inn tail and claw talon claw a well-known inn in sanctuary city, and the party's base of operations."}, {"id": "ashgate-watch", "title": "Ashgate Watch", "group": "Factions", "type": "faction", "typeLabel": "Faction", "layout": "prose", "dek": "Sanctuary City's watch, commanded by Lord Warden Brannoch Hale.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": ["Ashgate Guard", "Ash Gate Guard", "Ashgate guard"], "image": "", "html": "<p>The party murdered several members of the Ashgate Watch to sneak <a class=\"wl\" href=\"#urzel-the-radiant\">Urzel</a> into <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>. Alarm bells followed, and the rest of the Watch was alerted. The party escaped them in the back alleys.</p><p>Members of the Watch have since been claiming they saw individuals with wings, and it frightened them. In <a class=\"wl\" href=\"#session-3\">Session 3</a> the guard raided <a class=\"wl\" href=\"#annabel-swordbuck\">Annabel</a>'s smuggler's hide while the party was inside.</p><h2>Session 4</h2><p>The Watch is commanded by <a class=\"wl\" href=\"#brannoch-hale\">Brannoch Hale</a>, the Lord Warden of the Ashgate, who sits on the <a class=\"wl\" href=\"#economic-council\">Economic Council</a>. The Ashgate itself is the gate the party came through into the city a few nights earlier. The Watch guards the council heavily in <a class=\"wl\" href=\"#the-commerce-hall\">the Commerce Hall</a>.</p><p><a class=\"wl\" href=\"#torr\">Torr</a> and <a class=\"wl\" href=\"#bertrude\">Bertrude</a> talked the guards who raided <a class=\"wl\" href=\"#annabel-swordbuck\">Annabel</a>'s hide into leaving empty-handed. The morning after the churches burned, the Watch was running about more determined than ever to force control on the city. Not every guardsman is pious, but one at the council's gate was, and he escorted <a class=\"wl\" href=\"#urzel-the-radiant\">Urzel</a> inside himself.</p><p>In the council chamber, <a class=\"wl\" href=\"#idra-voss\">High Chancellor Idra Voss</a> admitted the heroes should never have been hunted through the streets like dogs.</p>", "backlinks": ["annabel-swordbuck", "brannoch-hale", "overview", "timeline", "economic-council", "threads", "sanctuary-city", "session-1", "session-2", "session-3", "session-4", "the-commerce-hall"], "search": "ashgate watch ashgate guard ash gate guard ashgate guard sanctuary city's watch, commanded by lord warden brannoch hale."}, {"id": "demons", "title": "Demons", "group": "Factions", "type": "faction", "typeLabel": "Faction", "layout": "prose", "dek": "The creatures overrunning the sewers beneath Sanctuary City.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "image": "", "html": "<p>The party's first encounter with demons was in <a class=\"wl\" href=\"#the-cistern\">the Cistern</a> in <a class=\"wl\" href=\"#session-3\">Session 3</a>. None of the heroes had faced one before.</p><p>Sanctuary City is under assault by demons. That is why no one goes into the sewers, why strange bodies are being pulled out of the canals, and why everything in the city has gone astray.</p><h2>What the Party Has Learned</h2><ul><li>They are weak to holy damage.</li><li>A demon that is badly hurt fights more desperately, and becomes easier to hit.</li><li>They answered to a voice from the centre of the cistern, which ordered them to \"finish these fools\".</li><li>They are in the city because of a bargain. <a class=\"wl\" href=\"#idra-voss\">High Chancellor Idra Voss</a> signed a deal with a demon, <a class=\"wl\" href=\"#harkonex\">Harkonex</a>, to save the city from ruin and starvation. It has proved insatiable.</li></ul><h2>Kinds Encountered</h2><ul><li><a class=\"wl\" href=\"#pitling\">Pitling</a></li><li><a class=\"wl\" href=\"#ruinant\">Ruinant</a></li><li><a class=\"wl\" href=\"#frenzied\">Frenzied</a></li><li><a class=\"wl\" href=\"#torlas\">Torlas</a></li><li><a class=\"wl\" href=\"#bendrak\">Bendrak</a></li><li><a class=\"wl\" href=\"#fiktin\">Fiktin</a></li></ul>", "backlinks": ["bendrak", "overview", "economic-council", "fiktin", "frenzied", "harkonex", "threads", "pitling", "ruinant", "sanctuary-city", "session-3", "the-cistern", "torlas"], "search": "demons the creatures overrunning the sewers beneath sanctuary city."}, {"id": "economic-council", "title": "Economic Council", "group": "Factions", "type": "faction", "typeLabel": "Faction", "layout": "prose", "dek": "The greedy, secretive council that rules Sanctuary City.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Ruling Council"], "image": "", "html": "<p><a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a> is ruled by an economic council. Rumour put it at four members, possibly more, and secrecy surrounds it. The barkeep at <a class=\"wl\" href=\"#the-tail-and-claw\">the Tail and Claw</a> calls them a greedy bunch. They hold council in <a class=\"wl\" href=\"#the-commerce-hall\">the Commerce Hall</a> at the centre of the city, with the <a class=\"wl\" href=\"#ashgate-watch\">Ashgate Watch</a> wrapped tight around it. With the city in chaos, most of their engagements and events have been cancelled.</p><p>Reaching them means getting through layer after layer of bureaucracy. In <a class=\"wl\" href=\"#session-4\">Session 4</a> that took a failed bribe, a tail, a game of dice and a pious guardsman.</p><h2>Members</h2><ul><li><a class=\"wl\" href=\"#idra-voss\">High Chancellor Idra Voss</a> — head of the council.</li><li><a class=\"wl\" href=\"#brannoch-hale\">Brannoch Hale</a> — Lord Warden of the Ashgate, in charge of the Watch.</li><li><a class=\"wl\" href=\"#lucan-fairweather\">Lucan Fairweather</a> — knows something about <a class=\"wl\" href=\"#hugh\">Hugh</a>.</li><li><a class=\"wl\" href=\"#orsolya-venn\">Orsolya Venn</a> — Prelate of <a class=\"wl\" href=\"#the-gilded-scale\">the Gilded Scale</a>.</li></ul><h2>The Secret</h2><p>Idra Voss told the party that she signed a deal with a demon, <a class=\"wl\" href=\"#harkonex\">Harkonex</a>, to save the city from ruin and starvation. That deal is the source of the <a class=\"wl\" href=\"#demons\">Demons</a> in the sewers. Brannoch tried to stop her saying so.</p>", "backlinks": ["annabel-swordbuck", "ashgate-watch", "brannoch-hale", "overview", "timeline", "idra-voss", "hugh", "lucan-fairweather", "orsolya-venn", "sanctuary-city", "session-4", "the-commerce-hall", "the-gilded-scale", "the-tail-and-claw"], "search": "economic council ruling council the greedy, secretive council that rules sanctuary city."}, {"id": "the-gilded-scale", "title": "The Gilded Scale", "group": "Factions", "type": "faction", "typeLabel": "Faction", "layout": "prose", "dek": "The faith tied to Sanctuary City's economy, led by Prelate Orsolya Venn.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": [], "image": "", "html": "<p>A religious body in <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a> that oversees the religious side of the city's economy. Its prelate, <a class=\"wl\" href=\"#orsolya-venn\">Orsolya Venn</a>, sits on the <a class=\"wl\" href=\"#economic-council\">Economic Council</a> and dresses in yellow robes marked with religious inscriptions and emblems of office.</p><p>Nothing more is known yet. The night before the party met the council, hooded figures attacked churches and holy sites across the city.</p>", "backlinks": ["overview", "economic-council", "orsolya-venn", "sanctuary-city", "session-4"], "search": "the gilded scale the faith tied to sanctuary city's economy, led by prelate orsolya venn."}, {"id": "amulet-of-the-delian-order", "title": "Amulet of the Delian Order", "group": "Things", "type": "thing", "typeLabel": "Item", "layout": "prose", "dek": "This large brass amulet is shaped to look like a shining sun.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "image": "images/amulet-of-the-delian-order.png", "html": "<p><strong>Keywords:</strong> Magic</p><p>While you wear this amulet, you gain a +1 bonus to saving throws. Additionally, while wearing the amulet, you can dispel the ward on the first level of the Delian Tomb as a main action while you are adjacent to it.</p>", "backlinks": [], "search": "amulet of the delian order this large brass amulet is shaped to look like a shining sun."}, {"id": "bloodbound-band", "title": "Bloodbound Band", "group": "Things", "type": "thing", "typeLabel": "Item", "layout": "prose", "dek": "This ring appears to be traced by dried blood, which returns each time it is rubbed away.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "image": "images/bloodbound-band.png", "html": "<p><strong>Keywords:</strong> Magic, Ring</p><p>While you wear this ring, you gain a +6 bonus to Stamina. Additionally, during a respite, you can touch the ring to any number of other Bloodbound Bands worn by willing creatures to form a bond among all of you. Creatures related by blood can’t form bonds in this way. Bonded creatures can each use the highest recovery value of any bonded creature in place of their own, and can spend each other’s Recoveries as if they were their own. Whenever any other bonded creature takes damage, each bonded creature takes 1 damage that can’t be reduced in any way. Your bond ends if you remove the ring, use it to bond with one or more other creatures, or die, but other rings continue to be bonded to each other.</p>", "backlinks": [], "search": "bloodbound band this ring appears to be traced by dried blood, which returns each time it is rubbed away."}, {"id": "cup-of-iulius", "title": "Cup of Iulius", "group": "Things", "type": "thing", "typeLabel": "Item", "layout": "prose", "dek": "This silver chalice is carved with the image of kneeling Caelian knights and never seems to tarnish.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "image": "images/cup-of-iulius.png", "html": "<p><strong>Keywords:</strong> Magic</p><p>You can fill the Cup of Iulius with a liquid and drink the entirety of the liquid as a maneuver. You gain the following benefits based on the liquid consumed if you drink a cup’s worth:</p><ul><li><strong>Caelian Wine Over 1,000 Years Old or the Blood of an Innocent Humanoid:</strong> Your level increases by 1 for the next 10 days. At the end of this time, roll a d10. On a result of 6 or higher, you die and can’t be returned to life. If you drink to gain this benefit again while it is currently active, the expiration resets.</li><li><strong>Mead That is 100 Years Old or More:</strong> At the start of the next combat encounter you have, you gain surges equal to your highest characteristic score plus your Victories.</li><li><strong>Water:</strong> You regain 1 Recovery. You can’t gain this benefit again until you complete a respite.</li></ul>", "backlinks": [], "search": "cup of iulius this silver chalice is carved with the image of kneeling caelian knights and never seems to tarnish."}, {"id": "delian-knight-commanders-ring", "title": "Delian Knight Commander’s Ring", "group": "Things", "type": "thing", "typeLabel": "Item", "layout": "prose", "dek": "The ring is a gold band with an emerald cut like a shield.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Delian Knight Commander's Ring"], "image": "images/delian-knight-commanders-ring.png", "html": "<p><strong>Keywords:</strong> Magic</p><p>While you wear this ring, the distance of ranged abilities that target only you or your allies increases by 2.</p>", "backlinks": [], "search": "delian knight commander’s ring delian knight commander's ring the ring is a gold band with an emerald cut like a shield."}, {"id": "foesense-lenses", "title": "Foesense Lenses", "group": "Things", "type": "thing", "typeLabel": "Item", "layout": "prose", "dek": "These spectacles feature pink-tinted glass lenses held in a silver frame.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "image": "images/foesense-lenses.png", "html": "<p><strong>Keywords:</strong> Implement, Psionic</p><p>While you wield this implement, your magic or psionic abilities that deal rolled damage gain a +1 damage bonus. Additionally, whenever you deal rolled damage to a creature using a magic or psionic ability, you can use that creature’s senses until the end of your next turn, allowing you to experience all they observe and to use your abilities as if you were in their space. You also benefit from your own senses at the same time.</p>", "backlinks": [], "search": "foesense lenses these spectacles feature pink-tinted glass lenses held in a silver frame."}, {"id": "healing-potion", "title": "Healing Potion", "group": "Things", "type": "thing", "typeLabel": "Item", "layout": "prose", "dek": "Thick and red, this liquid tastes of sour beer.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "image": "images/healing-potion.png", "html": "<p><strong>Keywords:</strong> Magic, Potion</p><p><strong>Effect:</strong> When you drink this potion as a maneuver, you regain Stamina equal to your recovery value without spending a Recovery.</p>", "backlinks": [], "search": "healing potion thick and red, this liquid tastes of sour beer."}, {"id": "heelcutter", "title": "Heelcutter", "group": "Things", "type": "thing", "typeLabel": "Item", "layout": "prose", "dek": "This oversized double-sided axe is chipped, yet seems ever-sharp, no matter the abuses it faces.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "image": "images/heelcutter.png", "html": "<p><strong>Keywords:</strong> Heavy Weapon, Magic</p><p>Any damage-dealing weapon ability using this weapon gains a +1 rolled damage bonus, and if the target is a giant, they are A&lt;2 prone on a tier 3 result. When you are grabbed by a giant, you automatically escape at the start of your turn (no action).</p>", "backlinks": [], "search": "heelcutter this oversized double-sided axe is chipped, yet seems ever-sharp, no matter the abuses it faces."}, {"id": "the-mawblade", "title": "The Mawblade", "group": "Things", "type": "thing", "typeLabel": "Item", "layout": "prose", "dek": "A black iron weapon whose edge is lined with tiny ivory teeth. When blood touches it, the teeth begin chewing.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": ["More Blade", "Maul Blade"], "image": "images/the-mawblade.png", "html": "<p><strong>Keywords:</strong> Magic, Weapon</p><p>You sense power but you're not sure what this weapon will do when you use it in battle!</p><h2>History</h2><p>Found in <a class=\"wl\" href=\"#the-cistern\">the Cistern</a> in <a class=\"wl\" href=\"#session-3\">Session 3</a>. It was wrapped in rags and kept apart from the other items and debris that were going over the edge with the bodies.</p><p>The Director has promised to tell the party more about it.</p><h2>Session 4</h2><p><a class=\"wl\" href=\"#aurelion\">Aurelion</a> carries it. In the council chamber of <a class=\"wl\" href=\"#the-commerce-hall\">the Commerce Hall</a>, he drew it from behind his back and asked the council, \"Does this interest you?\"</p><p>It did. <a class=\"wl\" href=\"#idra-voss\">High Chancellor Idra Voss</a>'s eyes sparkled at the sight of it, and so did her attendants'. <a class=\"wl\" href=\"#brannoch-hale\">Brannoch Hale</a> was on his feet with a hand on his own weapon: \"That thing of all items.\" He demanded to know where they had found it and what its nature was. He seems to recognise it.</p>", "backlinks": ["brannoch-hale", "overview", "timeline", "idra-voss", "threads", "session-3", "session-4", "the-cistern"], "search": "the mawblade more blade maul blade a black iron weapon whose edge is lined with tiny ivory teeth. when blood touches it, the teeth begin chewing."}, {"id": "unblinking-candle", "title": "Unblinking Candle", "group": "Things", "type": "thing", "typeLabel": "Item", "layout": "prose", "dek": "", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "image": "images/unblinking-candle.png", "html": "<p><strong>Keywords:</strong> Magic</p><p><strong>Effect:</strong> This candle sheds no heat and spills no wax. It can burn even in conditions that would extinguish a mundane candle, such as underwater.</p>", "backlinks": [], "search": "unblinking candle "}, {"id": "bendrak", "title": "Bendrak", "group": "Bestiary", "type": "enemy", "typeLabel": "Monster", "layout": "prose", "dek": "A demon like a horse with a strange head, gems floating around its body.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Bendrax", "Bend Rack", "Bendrac", "Bandrack", "Bendrag", "Bendrick"], "image": "images/bendrak.png", "html": "<p>A <a class=\"wl\" href=\"#demons\">demon</a> that looks like a horse with a strange head, with gems floating around its body and a long, skinny neck. It hangs back behind cover and warps its victims' perceptions. Someone under its influence finds their blows turned partly onto their friends. It died in <a class=\"wl\" href=\"#the-cistern\">the Cistern</a> making one last attempt to bend <a class=\"wl\" href=\"#aurelion\">Aurelion</a>'s mind. Met in <a class=\"wl\" href=\"#session-3\">Session 3</a>.</p>", "backlinks": ["timeline", "demons", "session-3"], "search": "bendrak bendrax bend rack bendrac bandrack bendrag bendrick a demon like a horse with a strange head, gems floating around its body."}, {"id": "fiktin", "title": "Fiktin", "group": "Bestiary", "type": "enemy", "typeLabel": "Monster", "layout": "prose", "dek": "Humanoid demons of dripping, oily blood that disguise themselves as objects.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Fitkin", "Fitkins", "Ficton", "Fictons", "Ficken", "Fickens"], "image": "images/fiktin.png", "html": "<p>Humanoid in shape but made entirely of dripping, oily blood, solid only to a degree. Fiktins can transform into mundane objects: one waited underwater as a rock, and another burst out of the rags of a corpse. They were the strongest <a class=\"wl\" href=\"#demons\">Demons</a> the party had faced.</p><p>They rose from <a class=\"wl\" href=\"#the-cistern\">the Cistern</a> when a voice ordered the demons to \"finish these fools\", and they fought to the death. Met in <a class=\"wl\" href=\"#session-3\">Session 3</a>.</p>", "backlinks": ["timeline", "demons", "session-3"], "search": "fiktin fitkin fitkins ficton fictons ficken fickens humanoid demons of dripping, oily blood that disguise themselves as objects."}, {"id": "frenzied", "title": "Frenzied", "group": "Bestiary", "type": "enemy", "typeLabel": "Monster", "layout": "prose", "dek": "Fast demons with huge claws and many teeth.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "image": "images/frenzied.png", "html": "<p><a class=\"wl\" href=\"#demons\">Demons</a> that move very fast, especially with a <a class=\"wl\" href=\"#ruinant\">Ruinant</a> leading them, and have huge claws and lots of teeth. In <a class=\"wl\" href=\"#the-cistern\">the Cistern</a>, frenzied were seen to crack, bend and split open from within to become ruinants. Met in <a class=\"wl\" href=\"#session-3\">Session 3</a>.</p>", "backlinks": ["timeline", "demons", "ruinant", "session-3"], "search": "frenzied fast demons with huge claws and many teeth."}, {"id": "pitling", "title": "Pitling", "group": "Bestiary", "type": "enemy", "typeLabel": "Monster", "layout": "prose", "dek": "Stinking little demons with many tongues, spitting acid.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "image": "images/pitling.png", "html": "<p>Disgusting little <a class=\"wl\" href=\"#demons\">Demons</a> with multiple tongues and bodies split horrifically open. Their stench is enough to make you gag, and saliva dribbles from tongue to cheek. They fight in packs led by a <a class=\"wl\" href=\"#ruinant\">Ruinant</a>, spitting acid from range, and fall quickly when hit, but they stack up if ignored.</p><p>Met in <a class=\"wl\" href=\"#the-cistern\">the Cistern</a> in <a class=\"wl\" href=\"#session-3\">Session 3</a>. Some scampered off into the tunnels.</p>", "backlinks": ["timeline", "demons", "threads", "session-3"], "search": "pitling stinking little demons with many tongues, spitting acid."}, {"id": "ruinant", "title": "Ruinant", "group": "Bestiary", "type": "enemy", "typeLabel": "Monster", "layout": "prose", "dek": "Demon captains. Each pack has one.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Runant"], "image": "images/ruinant.png", "html": "<p>Not big, but a captain: each pack of lesser <a class=\"wl\" href=\"#demons\">Demons</a> has a ruinant directing it, and the pack fights harder while it lives. Ruinants sprint through water as if it isn't there and attack with bloodletting claws.</p><p>In <a class=\"wl\" href=\"#the-cistern\">the Cistern</a>, a <a class=\"wl\" href=\"#frenzied\">Frenzied</a> cracked and split from within to become a new ruinant, twice. One ruinant fled into the tunnels at the end of the fight. Met in <a class=\"wl\" href=\"#session-3\">Session 3</a>.</p>", "backlinks": ["timeline", "demons", "frenzied", "threads", "pitling", "session-3"], "search": "ruinant runant demon captains. each pack has one."}, {"id": "torlas", "title": "Torlas", "group": "Bestiary", "type": "enemy", "typeLabel": "Monster", "layout": "prose", "dek": "Demons that turn the ground to flesh and drag their prey through it.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Taulas", "Tall Ass", "Torilis"], "image": "images/torlas.png", "html": "<p><a class=\"wl\" href=\"#demons\">Demons</a> that turn an area of ground into spongy flesh, which tears at anyone forced to move through it. They pull targets towards them with grasping tendrils. In <a class=\"wl\" href=\"#the-cistern\">the Cistern</a>, two of them dragged <a class=\"wl\" href=\"#aurelion\">Aurelion</a> back and forth through the flesh and seemed to enjoy it. Met in <a class=\"wl\" href=\"#session-3\">Session 3</a>.</p>", "backlinks": ["timeline", "demons", "session-3"], "search": "torlas taulas tall ass torilis demons that turn the ground to flesh and drag their prey through it."}];
const TITLES = {"amulet-of-the-delian-order": "Amulet of the Delian Order", "annabel-swordbuck": "Annabel Swordbuck", "ashgate-watch": "Ashgate Watch", "aurelion": "Aurelion", "bendrak": "Bendrak", "bertrude": "Bertrude", "bloodbound-band": "Bloodbound Band", "brannoch-hale": "Brannoch Hale", "broadhurst": "Broadhurst", "cup-of-iulius": "Cup of Iulius", "delian-knight-commanders-ring": "Delian Knight Commander’s Ring", "demons": "Demons", "economic-council": "Economic Council", "fiktin": "Fiktin", "foesense-lenses": "Foesense Lenses", "frenzied": "Frenzied", "grain-square": "Grain Square", "harkonex": "Harkonex", "healing-potion": "Healing Potion", "heelcutter": "Heelcutter", "hugh": "Hugh", "idra-voss": "High Chancellor Idra Voss", "lucan-fairweather": "Lucan Fairweather", "malthazar": "Malthazar", "orsolya-venn": "Orsolya Venn", "overview": "Campaign Overview", "pitling": "Pitling", "ruinant": "Ruinant", "sanctuary-city": "Sanctuary City", "session-1": "Session 1 — The Road to Sanctuary", "session-2": "Session 2 — Into the Alleys", "session-3": "Session 3 — The Cistern", "session-4": "Session 4 — The Shadow Comes Loose", "the-cistern": "The Cistern", "the-commerce-hall": "The Commerce Hall", "the-gilded-scale": "The Gilded Scale", "the-mawblade": "The Mawblade", "the-tail-and-claw": "The Tail and Claw", "threads": "Open Threads", "timeline": "Campaign Timeline", "torlas": "Torlas", "torr": "Torr", "unblinking-candle": "Unblinking Candle", "urzel-the-radiant": "Urzel the Radiant"};
const BUILT  = "2026-10-28";
const byId = Object.fromEntries(PAGES.map(p => [p.id, p]));
let current = PAGES.length ? PAGES[0].id : "";

const main = document.getElementById("main");
const nav  = document.getElementById("nav");
const q    = document.getElementById("q");

function esc(value){
  return String(value == null ? "" : value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderPage(id){
  const p = byId[id];
  if(!p) return "<p>Page not found.</p>";
  let h = '<div class="crumb">' + p.group + '</div>';
  h += '<h1 class="ttl">' + p.title + '</h1>';
  if(p.dek) h += '<div class="dek">' + p.dek + '</div>';

  if(p.type !== "doc"){
    h += '<div class="badges"><span class="tag t-' + p.type + '">' + p.typeLabel + '</span>';
    if(p.player) h += '<span class="tag">Played by ' + p.player + '</span>';
    if(p.conf)   h += '<span class="tag"><span class="conf"><span class="dot ' + p.conf + '"></span>' + p.confLabel + '</span></span>';
    h += '</div>';
    if(p.aliases.length){
      h += '<div class="panel"><div class="ph">Also transcribed as</div><div>'
         + p.aliases.map(a => '<span class="alias">' + a + '</span>').join('')
         + '</div></div>';
    }
  }

  if(p.image) h += '<figure class="portrait"><img src="' + p.image + '" alt="' + p.title + '" loading="lazy"></figure>';
  h += '<div class="prose">' + p.html + '</div>';

  if(p.backlinks.length){
    h += '<div class="backlinks"><div class="ph">Mentioned in</div><ul>'
       + p.backlinks.map(b => '<li><a href="#' + b + '">' + TITLES[b] + '</a></li>').join('')
       + '</ul></div>';
  }

  h += '<div class="foot">Built from campaign records and session notes. Entity names carry every known spelling; '
     + 'anything marked <em>needs review</em> or <em>low confidence</em> is waiting on confirmation before it becomes canon. '
     + 'Built ' + BUILT + '.</div>';
  return h;
}

function renderNav(filter){
  const f = (filter || "").trim().toLowerCase();
  const groups = [];
  PAGES.forEach(p => {
    if(f && p.search.indexOf(f) === -1) return;
    let g = groups.find(x => x.name === p.group);
    if(!g){ g = {name:p.group, items:[]}; groups.push(g); }
    g.items.push(p);
  });
  if(!groups.length) return '<div style="padding:4px 20px;color:var(--muted);font-size:14px">Nothing matches.</div>';
  return groups.map(g =>
    '<div class="grp"><div class="lbl">' + g.name + '</div>'
    + g.items.map(p =>
        '<a href="#' + p.id + '"' + (p.id === current ? ' aria-current="page"' : '') + '>'
        + '<span>' + p.title + '</span>'
        + (p.type !== "doc" && p.backlinks.length ? '<span class="n">' + p.backlinks.length + '</span>' : '')
        + '</a>').join('')
    + '</div>').join('');
}

function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  current = byId[id] ? id : (PAGES.length ? PAGES[0].id : "");
  main.innerHTML = renderPage(current);
  nav.innerHTML = renderNav(q.value);
  document.title = (byId[current] ? byId[current].title + " · " : "") + "Sanctuary City";
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
q.addEventListener("input", function(){ nav.innerHTML = renderNav(q.value); });

document.getElementById("themebtn").addEventListener("click", function(){
  const root = document.documentElement;
  const now = root.getAttribute("data-theme");
  const dark = now ? now === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.setAttribute("data-theme", dark ? "light" : "dark");
  try { localStorage.setItem("ds-theme", dark ? "light" : "dark"); } catch(e){}
});
try {
  const saved = localStorage.getItem("ds-theme");
  if(saved) document.documentElement.setAttribute("data-theme", saved);
} catch(e){}

route();
</script>
