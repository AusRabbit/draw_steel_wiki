<style>
  :root{
    --bg:#EDEFF2; --surface:#FFFFFF; --surface-2:#F5F7F9;
    --ink:#191D23; --muted:#59636F; --line:#D6DBE1;
    --amber:#9E2A2B; --amber-soft:#F2DCDC;
    --teal:#3F5873; --teal-soft:#DDE4EC;
    --rust:#9C3B2E; --rust-soft:#F2DFDB;
    --display:"Zilla Slab",Georgia,serif;
    --body:"Source Sans 3",system-ui,-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sp:clamp(16px,3vw,28px);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#13161A; --surface:#1B1F25; --surface-2:#22272E;
      --ink:#E4E8ED; --muted:#939DA9; --line:#2E353E;
      --amber:#E07A73; --amber-soft:#3A1E1E;
      --teal:#8FA8C4; --teal-soft:#1D2733;
      --rust:#D4776A; --rust-soft:#3A221E;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#13161A; --surface:#1B1F25; --surface-2:#22272E;
    --ink:#E4E8ED; --muted:#939DA9; --line:#2E353E;
    --amber:#E07A73; --amber-soft:#3A1E1E;
    --teal:#8FA8C4; --teal-soft:#1D2733;
    --rust:#D4776A; --rust-soft:#3A221E;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--body); font-size:16px; line-height:1.6;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  img{max-width:100%}
  a{color:inherit}
  h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0; font-weight:600}
  code{font-family:var(--mono); font-size:.92em; background:var(--surface-2); padding:1px 5px; border-radius:3px}

  .shell{display:grid; grid-template-columns:270px minmax(0,1fr)}
  @media (max-width:820px){ .shell{grid-template-columns:minmax(0,1fr)} }

  .rail{
    border-right:1px solid var(--line); background:var(--surface);
    padding:var(--sp) 0 48px; position:sticky; top:env(safe-area-inset-top,0px);
    align-self:start; max-height:100vh; overflow-y:auto;
  }
  @media (max-width:820px){
    .rail{position:static; max-height:none; border-right:0; border-bottom:1px solid var(--line); padding-bottom:20px}
  }
  .brand{padding:0 20px 18px; border-bottom:1px solid var(--line); margin-bottom:14px}
  .brand .ship{font-family:var(--display); font-size:21px; font-weight:700; line-height:1.15; letter-spacing:-.01em}
  .brand .sub{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:7px}

  .search{margin:0 20px 16px}
  .search input{
    width:100%; padding:8px 11px; border-radius:7px; font-family:var(--body); font-size:14px;
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
  }
  .search input:focus{outline:2px solid var(--amber); outline-offset:1px}

  .grp{margin-bottom:16px}
  .grp > .lbl{font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); padding:0 20px; margin-bottom:5px}
  .nav a{display:flex; align-items:baseline; gap:8px; justify-content:space-between; padding:5px 20px; text-decoration:none; font-size:14.5px; border-left:2px solid transparent}
  .nav a:hover{background:var(--surface-2)}
  .nav a[aria-current="page"]{border-left-color:var(--amber); background:var(--surface-2); font-weight:600}
  .nav a:focus-visible{outline:2px solid var(--amber); outline-offset:-2px}
  .nav a .n{font-family:var(--mono); font-size:10.5px; color:var(--muted)}

  main{padding:var(--sp); padding-block:calc(var(--sp) + 6px) 90px; max-width:820px}
  .crumb{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
  .ttl{font-size:clamp(28px,5vw,40px); line-height:1.08; letter-spacing:-.02em; margin-bottom:6px}
  .dek{color:var(--muted); font-size:17px; margin-bottom:22px}

  .badges{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px}
  .tag{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:4px; background:var(--surface-2); color:var(--muted); border:1px solid var(--line)}
  .tag.t-character{background:var(--teal-soft); color:var(--teal); border-color:transparent}
  .tag.t-place{background:var(--amber-soft); color:var(--amber); border-color:transparent}
  .tag.t-faction{background:var(--rust-soft); color:var(--rust); border-color:transparent}
  .tag.t-enemy{background:var(--rust-soft); color:var(--rust); border-color:transparent}
  .conf{display:inline-flex; align-items:center; gap:5px}
  .dot{width:7px; height:7px; border-radius:50%; display:inline-block}
  .dot.hi{background:var(--teal)} .dot.mid{background:var(--amber)} .dot.lo{background:var(--rust)}

  .prose p{margin:0 0 15px}
  .prose h2{font-size:15px; letter-spacing:.02em; margin:30px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line)}
  .prose ul{margin:0 0 16px; padding-left:20px}
  .prose li{margin-bottom:7px}
  .prose em{color:var(--muted)}

  a.wl{color:var(--teal); text-decoration:none; border-bottom:1px solid color-mix(in srgb, var(--teal) 35%, transparent); padding-bottom:.5px}
  a.wl:hover{border-bottom-color:var(--teal); background:var(--teal-soft)}
  a.wl.missing{color:var(--rust); border-bottom-style:dotted; border-bottom-color:var(--rust)}

  .panel{border:1px solid var(--line); border-radius:9px; background:var(--surface); padding:16px 18px; margin:0 0 18px}
  .panel .ph{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:9px}
  .panel p{margin:0}
  .panel.note{background:var(--surface-2)}
  .panel.warn{border-left:3px solid var(--rust)}

  .alias{display:inline-block; font-family:var(--mono); font-size:11.5px; padding:2px 7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); margin:0 4px 4px 0; color:var(--muted)}

  .backlinks{margin-top:34px; padding-top:16px; border-top:1px solid var(--line)}
  .backlinks .ph{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
  .backlinks ul{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px}
  .backlinks li a{font-size:13.5px; text-decoration:none; padding:3px 9px; border-radius:5px; background:var(--surface-2); border:1px solid var(--line)}
  .backlinks li a:hover{border-color:var(--teal); color:var(--teal)}

  .thread{border-left:2px solid var(--line); padding:0 0 2px 15px; margin-bottom:20px}
  .thread.open{border-left-color:var(--amber)}
  .thread.hot{border-left-color:var(--rust)}
  .thread h3{font-size:16.5px; margin-bottom:3px}
  .thread .st{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:5px}
  .thread p{margin:0; font-size:15px}

  .beat{display:grid; grid-template-columns:70px minmax(0,1fr); gap:14px; margin-bottom:16px}
  .timeline-session{font-size:20px!important; margin:32px 0 16px!important; padding-bottom:7px!important; border-bottom:1px solid var(--line)!important}
  .timeline-session:first-child{margin-top:4px!important}
  @media (max-width:520px){ .beat{grid-template-columns:minmax(0,1fr); gap:2px} }
  .beat .t{font-family:var(--mono); font-size:11.5px; color:var(--muted); padding-top:4px}
  .beat .b p{margin:2px 0 0; font-size:14.5px; color:var(--muted)}

  .portrait{margin:0 0 22px; width:min(300px,100%); aspect-ratio:1; border-radius:10px; overflow:hidden; background:radial-gradient(circle at 50% 40%, var(--surface-2), var(--line)); border:1px solid var(--line)}
  .portrait img{display:block; width:100%; height:100%; object-fit:contain}
  .foot{margin-top:44px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; color:var(--muted)}

  .themebtn{
    position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px));
    border:1px solid var(--line); background:var(--surface); color:var(--muted);
    font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    padding:7px 11px; border-radius:6px; cursor:pointer;
  }
  .themebtn:hover{color:var(--ink); border-color:var(--amber)}
  @media (prefers-reduced-motion:no-preference){ .nav a,a.wl,.backlinks li a{transition:background .12s,color .12s,border-color .12s} }
</style>
</head>

<script>
const PAGES  = [{"id": "overview", "title": "Campaign Overview", "group": "Campaign", "type": "doc", "typeLabel": "Session", "layout": "prose", "dek": "Where the party stands at the end of Session 4.", "conf": "", "confLabel": "", "player": "", "aliases": [], "image": "", "html": "<p>The heroes set out from <a class=\"wl\" href=\"#broadhurst\">Broadhurst</a> for <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>. Getting in did not go cleanly: the party was split at the gates, and <a class=\"wl\" href=\"#urzel-the-radiant\">Urzel</a> was only brought inside after the others murdered members of the <a class=\"wl\" href=\"#ashgate-watch\">Ashgate Watch</a>.</p><h2>How They Got Here</h2><p>The party escaped the Watch, found <a class=\"wl\" href=\"#annabel-swordbuck\">Annabel Swordbuck</a>'s smuggler's hide, and lost it again when the guard broke in. <a class=\"wl\" href=\"#bertrude\">Bertrude</a> and <a class=\"wl\" href=\"#torr\">Torr</a> stayed behind and talked the guard away. The rest escaped into the sewers and got Annabel's crew through them. Beneath the city they found <a class=\"wl\" href=\"#the-cistern\">a cistern</a> overrun by <a class=\"wl\" href=\"#demons\">Demons</a>, with bodies being sent over the edge into an abyss, and among the bodies they found <a class=\"wl\" href=\"#the-mawblade\">the Mawblade</a>.</p><h2>Current Position</h2><p>Reunited at <a class=\"wl\" href=\"#the-tail-and-claw\">the Tail and Claw</a>, the party learned from Annabel that their friend <a class=\"wl\" href=\"#hugh\">Hugh</a> has a patron in the highest places in the city. She went scouting with <a class=\"wl\" href=\"#malthazar\">Malthazar</a> and sent the others to the <a class=\"wl\" href=\"#economic-council\">Economic Council</a>, which rules Sanctuary City. The city woke to churches and holy sites burning, attacked overnight by hooded figures.</p><p><a class=\"wl\" href=\"#aurelion\">Aurelion</a>, Torr and Urzel talked, gambled and prayed their way into <a class=\"wl\" href=\"#the-commerce-hall\">the Commerce Hall</a> and won an audience with the council. There <a class=\"wl\" href=\"#idra-voss\">High Chancellor Idra Voss</a> confessed that she signed a deal with a demon, <a class=\"wl\" href=\"#harkonex\">Harkonex</a>, to save the city from ruin and starvation, and that it is now out of control. She asked for the heroes' help.</p><p>When she pressed <a class=\"wl\" href=\"#lucan-fairweather\">Lucan Fairweather</a> about Hugh, <a class=\"wl\" href=\"#orsolya-venn\">Orsolya Venn</a>, Prelate of <a class=\"wl\" href=\"#the-gilded-scale\">the Gilded Scale</a>, cut him off. Wind tore through the chamber, her shadow came loose and fragmented across the room, and she began to chant a spell. Session 4 ended on the edge of a fight.</p><h2>The Heroes</h2><ul><li><a class=\"wl\" href=\"#aurelion\">Aurelion</a> — human censor, a former watch officer.</li><li><a class=\"wl\" href=\"#bertrude\">Bertrude</a> — human telepath, a disavowed agent.</li><li><a class=\"wl\" href=\"#malthazar\">Malthazar</a> — dragon knight shadow with a criminal past.</li><li><a class=\"wl\" href=\"#torr\">Torr</a> — high elf tactician raised among the Wode Elves.</li><li><a class=\"wl\" href=\"#urzel-the-radiant\">Urzel the Radiant</a> — orc conduit of Life and Sun.</li></ul><p>Session-by-session detail is in the recaps, the cumulative <a class=\"wl\" href=\"#timeline\">Campaign Timeline</a> and the <a class=\"wl\" href=\"#threads\">Open Threads</a> page.</p>", "backlinks": [], "search": "campaign overview where the party stands at the end of session 4."}, {"id": "timeline", "title": "Campaign Timeline", "group": "Campaign", "type": "doc", "typeLabel": "Session", "layout": "timeline", "dek": "Session beats in order.", "conf": "", "confLabel": "", "player": "", "aliases": [], "image": "", "html": "<h2 class=\"timeline-session\">Session 1</h2><div class=\"beat\"><div class=\"t\">1</div><div class=\"b\"><strong>Departure</strong><p>The party leaves <a class=\"wl\" href=\"#broadhurst\">Broadhurst</a> for <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>.</p></div></div><div class=\"beat\"><div class=\"t\">2</div><div class=\"b\"><strong>Refugees</strong><p>Hopeful refugees on the road to Sanctuary City.</p></div></div><div class=\"beat\"><div class=\"t\">3</div><div class=\"b\"><strong>The gates</strong><p>The party is interrogated at the gates and split up.</p></div></div><div class=\"beat\"><div class=\"t\">4</div><div class=\"b\"><strong>Something is off</strong><p>Inside Sanctuary City, something is not right.</p></div></div><div class=\"beat\"><div class=\"t\">5</div><div class=\"b\"><strong>The side gate</strong><p>A scene at a side gate into the city.</p></div></div><div class=\"beat\"><div class=\"t\">6</div><div class=\"b\"><strong>Getting Urzel in</strong><p><a class=\"wl\" href=\"#the-tail-and-claw\">The Tail and Claw</a>, criminal elements, stolen uniforms, and members of the <a class=\"wl\" href=\"#ashgate-watch\">Ashgate Watch</a> murdered to sneak <a class=\"wl\" href=\"#urzel-the-radiant\">Urzel</a> in.</p></div></div><h2 class=\"timeline-session\">Session 2</h2><div class=\"beat\"><div class=\"t\">1</div><div class=\"b\"><strong>Alarm bells</strong><p>The Watch is alerted and the party flees into the back alleys.</p></div></div><div class=\"beat\"><div class=\"t\">2</div><div class=\"b\"><strong>The chase</strong><p>The party escapes the Ashgate Watch.</p></div></div><div class=\"beat\"><div class=\"t\">3</div><div class=\"b\"><strong>The bolt hole</strong><p><a class=\"wl\" href=\"#annabel-swordbuck\">Annabel Swordbuck</a> is found in a smuggler's bolt hole.</p></div></div><h2 class=\"timeline-session\">Session 3</h2><div class=\"beat\"><div class=\"t\">00:09</div><div class=\"b\"><strong>Malthazar's detour</strong><p><a class=\"wl\" href=\"#malthazar\">Malthazar</a> beat up three thieves robbing a rich girl, then robbed her himself.</p></div></div><div class=\"beat\"><div class=\"t\">00:10</div><div class=\"b\"><strong>Wings in the night</strong><p><a class=\"wl\" href=\"#ashgate-watch\">Ashgate</a> guards are telling stories about winged individuals.</p></div></div><div class=\"beat\"><div class=\"t\">00:10</div><div class=\"b\"><strong>Coins through the peephole</strong><p>Malthazar buys his way into <a class=\"wl\" href=\"#annabel-swordbuck\">Annabel</a>'s hide.</p></div></div><div class=\"beat\"><div class=\"t\">00:12</div><div class=\"b\"><strong>\"Open up, it's the guard!\"</strong><p>Annabel's crew vanishes. <a class=\"wl\" href=\"#torr\">Torr</a> tries to talk the guard away.</p></div></div><div class=\"beat\"><div class=\"t\">00:17</div><div class=\"b\"><strong>The false door</strong><p>Malthazar finds a hidden door behind the crates. <a class=\"wl\" href=\"#bertrude\">Bertrude</a> and Torr hold the door.</p></div></div><div class=\"beat\"><div class=\"t\">00:19</div><div class=\"b\"><strong>Into the sewers</strong><p><a class=\"wl\" href=\"#urzel-the-radiant\">Urzel</a> lights the way. Annabel blames the party for her lost goods.</p></div></div><div class=\"beat\"><div class=\"t\">00:21</div><div class=\"b\"><strong>Annabel's bargain</strong><p>Groups sent into the sewers don't come back; get her crew through.</p></div></div><div class=\"beat\"><div class=\"t\">00:27</div><div class=\"b\"><strong>Through the sewage</strong><p>Malthazar scouts ahead.</p></div></div><div class=\"beat\"><div class=\"t\">00:32</div><div class=\"b\"><strong>Demons</strong><p><a class=\"wl\" href=\"#the-cistern\">The Cistern</a> is full of <a class=\"wl\" href=\"#pitling\">pitlings</a>, <a class=\"wl\" href=\"#ruinant\">ruinants</a>, <a class=\"wl\" href=\"#frenzied\">Frenzied</a>, <a class=\"wl\" href=\"#torlas\">torlases</a> and a <a class=\"wl\" href=\"#bendrak\">Bendrak</a>.</p></div></div><div class=\"beat\"><div class=\"t\">01:17</div><div class=\"b\"><strong>A frenzied splits</strong><p>It cracks open from within and becomes a new ruinant.</p></div></div><div class=\"beat\"><div class=\"t\">01:25</div><div class=\"b\"><strong>Ping pong</strong><p>The torlases drag <a class=\"wl\" href=\"#aurelion\">Aurelion</a> back and forth through a floor of flesh.</p></div></div><div class=\"beat\"><div class=\"t\">01:38</div><div class=\"b\"><strong>\"Finish these fools\"</strong><p>A voice from the centre of the cistern. <a class=\"wl\" href=\"#fiktin\">Fiktins</a> rise from the water.</p></div></div><div class=\"beat\"><div class=\"t\">01:41</div><div class=\"b\"><strong>The bendrak dies</strong><p>Killed in one last attempt to bend Aurelion's mind.</p></div></div><div class=\"beat\"><div class=\"t\">01:48</div><div class=\"b\"><strong>The edge</strong><p>A woman's body drifts into a sinkhole like a pit to another world.</p></div></div><div class=\"beat\"><div class=\"t\">01:49</div><div class=\"b\"><strong>Draining the cistern</strong><p>Urzel works the sluice controls. A rock turns out to be a fiktin.</p></div></div><div class=\"beat\"><div class=\"t\">01:52</div><div class=\"b\"><strong>The bodies</strong><p>A mound of corpses being readied for the edge. Another fiktin bursts from the rags.</p></div></div><div class=\"beat\"><div class=\"t\">02:00</div><div class=\"b\"><strong>The fiktins fall</strong><p>They fight to the death.</p></div></div><div class=\"beat\"><div class=\"t\">02:01</div><div class=\"b\"><strong>The Mawblade</strong><p>A black iron blade lined with ivory teeth, set apart from the bodies.</p></div></div><div class=\"beat\"><div class=\"t\">02:02</div><div class=\"b\"><strong>The truth</strong><p>Sanctuary City is under assault by demons.</p></div></div><h2 class=\"timeline-session\">Session 4</h2><div class=\"beat\"><div class=\"t\">00:13</div><div class=\"b\"><strong>Holding the door</strong><p><a class=\"wl\" href=\"#torr\">Torr</a> and <a class=\"wl\" href=\"#bertrude\">Bertrude</a> talk the guard out of <a class=\"wl\" href=\"#annabel-swordbuck\">Annabel</a>'s hide without a fight.</p></div></div><div class=\"beat\"><div class=\"t\">00:16</div><div class=\"b\"><strong>Back at the Tail and Claw</strong><p>The others return from the sewers, filthy and stinking, to <a class=\"wl\" href=\"#the-tail-and-claw\">the Tail and Claw</a>.</p></div></div><div class=\"beat\"><div class=\"t\">00:19</div><div class=\"b\"><strong>Top shelf</strong><p>Annabel drinks to forget what she saw below.</p></div></div><div class=\"beat\"><div class=\"t\">00:22</div><div class=\"b\"><strong>Hugh's patron</strong><p>Annabel says <a class=\"wl\" href=\"#hugh\">Hugh</a> has friends in the highest places.</p></div></div><div class=\"beat\"><div class=\"t\">00:23</div><div class=\"b\"><strong>Scouting</strong><p>Annabel and <a class=\"wl\" href=\"#malthazar\">Malthazar</a> head out; the rest must reach the <a class=\"wl\" href=\"#economic-council\">Economic Council</a>.</p></div></div><div class=\"beat\"><div class=\"t\">00:30</div><div class=\"b\"><strong>The churches burn</strong><p>Hooded figures attack holy sites across the city overnight.</p></div></div><div class=\"beat\"><div class=\"t\">00:31</div><div class=\"b\"><strong>The one honest man</strong><p>Torr's bribe meets the only straight bureaucrat in the city.</p></div></div><div class=\"beat\"><div class=\"t\">00:34</div><div class=\"b\"><strong>Tailing the bureaucrat</strong><p><a class=\"wl\" href=\"#urzel-the-radiant\">Urzel</a> uncovers his chain of command.</p></div></div><div class=\"beat\"><div class=\"t\">00:36</div><div class=\"b\"><strong>The dice den</strong><p><a class=\"wl\" href=\"#aurelion\">Aurelion</a> wins a wager and the council's schedule.</p></div></div><div class=\"beat\"><div class=\"t\">00:44</div><div class=\"b\"><strong>\"Gruul the One-Handed\"</strong><p>A pious guardsman escorts Urzel into <a class=\"wl\" href=\"#the-commerce-hall\">the Commerce Hall</a>.</p></div></div><div class=\"beat\"><div class=\"t\">00:50</div><div class=\"b\"><strong>Big-time players</strong><p>Aurelion talks his way to the inner sanctum.</p></div></div><div class=\"beat\"><div class=\"t\">00:56</div><div class=\"b\"><strong>The council</strong><p><a class=\"wl\" href=\"#idra-voss\">Idra Voss</a>, <a class=\"wl\" href=\"#brannoch-hale\">Brannoch Hale</a>, <a class=\"wl\" href=\"#lucan-fairweather\">Lucan Fairweather</a> and <a class=\"wl\" href=\"#orsolya-venn\">Orsolya Venn</a>.</p></div></div><div class=\"beat\"><div class=\"t\">00:59</div><div class=\"b\"><strong>A hiccup</strong><p>Lucan flinches at Hugh's name.</p></div></div><div class=\"beat\"><div class=\"t\">01:02</div><div class=\"b\"><strong>Creatures in the sewers</strong><p>Idra clears the room.</p></div></div><div class=\"beat\"><div class=\"t\">01:04</div><div class=\"b\"><strong>The Mawblade drawn</strong><p><a class=\"wl\" href=\"#the-mawblade\">The Mawblade</a> makes Brannoch reach for his weapon.</p></div></div><div class=\"beat\"><div class=\"t\">01:09</div><div class=\"b\"><strong>\"Or you are a fool\"</strong><p>Urzel confronts the Lord Warden.</p></div></div><div class=\"beat\"><div class=\"t\">01:11</div><div class=\"b\"><strong>The statue</strong><p>Idra's statue in <a class=\"wl\" href=\"#grain-square\">Grain Square</a> reveals her vanity.</p></div></div><div class=\"beat\"><div class=\"t\">01:14</div><div class=\"b\"><strong>\"I signed a deal with a demon\"</strong><p>Idra confesses her bargain with <a class=\"wl\" href=\"#harkonex\">Harkonex</a>.</p></div></div><div class=\"beat\"><div class=\"t\">01:15</div><div class=\"b\"><strong>Who is Hugh?</strong><p>Idra presses Lucan to explain.</p></div></div><div class=\"beat\"><div class=\"t\">01:16</div><div class=\"b\"><strong>The shadow comes loose</strong><p>Orsolya interrupts and begins to chant a spell.</p></div></div>", "backlinks": ["overview"], "search": "campaign timeline session beats in order."}, {"id": "threads", "title": "Open Threads", "group": "Campaign", "type": "doc", "typeLabel": "Session", "layout": "threads", "dek": "What the party is carrying unresolved after Session 4.", "conf": "", "confLabel": "", "player": "", "aliases": [], "image": "", "html": "<div class=\"thread hot\"><div class=\"st\">Cliffhanger</div><h3>Orsolya's spell</h3><p>As <a class=\"wl\" href=\"#lucan-fairweather\">Lucan Fairweather</a> began to explain who <a class=\"wl\" href=\"#hugh\">Hugh</a> is, <a class=\"wl\" href=\"#orsolya-venn\">Orsolya Venn</a> interrupted. Wind tore through the council chamber, her shadow came away from her body and fragmented across the room, and she began to chant a spell. Session 4 ended on the edge of a fight.</p></div><div class=\"thread hot\"><div class=\"st\">Confessed</div><h3>Idra Voss's bargain</h3><p><a class=\"wl\" href=\"#idra-voss\">High Chancellor Idra Voss</a> admitted in private that she signed a deal with a demon, <a class=\"wl\" href=\"#harkonex\">Harkonex</a>, to save <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a> from ruin and starvation. The demon is insatiable and the infestation is getting out of hand. She can't confess it in public, and she has asked for the heroes' help.</p></div><div class=\"thread hot\"><div class=\"st\">Lucan knows something</div><h3>Where is Hugh?</h3><p>The party's friend <a class=\"wl\" href=\"#hugh\">Hugh</a> has a patron in the highest places in the city. Idra Voss didn't know the name, but Lucan Fairweather hiccupped when he heard it and was about to talk when he was interrupted.</p></div><div class=\"thread hot\"><div class=\"st\">New</div><h3>The burning churches</h3><p>The night after the party came up from the sewers, hooded figures attacked churches and holy sites across the city. People are talking about cult activity.</p></div><div class=\"thread open\"><div class=\"st\">Unexplained</div><h3>The bodies and the abyss</h3><p>In <a class=\"wl\" href=\"#the-cistern\">the Cistern</a>, an enormous mound of corpses was being prepared to go over the edge into a sinkhole that looks like a pit into another world. Strange bodies are also being pulled out of the city's canals.</p></div><div class=\"thread open\"><div class=\"st\">Partly answered</div><h3>Who commands the demons?</h3><p>A voice from the centre of the Cistern ordered the <a class=\"wl\" href=\"#demons\">Demons</a> to \"finish these fools\". Idra Voss's deal with Harkonex explains why the demons are here, but not whose voice that was.</p></div><div class=\"thread open\"><div class=\"st\">Recognised</div><h3>The Mawblade</h3><p><a class=\"wl\" href=\"#aurelion\">Aurelion</a> carries <a class=\"wl\" href=\"#the-mawblade\">the Mawblade</a>. When he drew it in the council chamber, Idra Voss's eyes sparkled and <a class=\"wl\" href=\"#brannoch-hale\">Brannoch Hale</a> reached for his own weapon: \"That thing of all items.\" He demanded to know where they found it and what its nature is.</p></div><div class=\"thread open\"><div class=\"st\">Scouting</div><h3>Annabel and Malthazar</h3><p><a class=\"wl\" href=\"#annabel-swordbuck\">Annabel</a> and <a class=\"wl\" href=\"#malthazar\">Malthazar</a> are working the city's criminal element for information on Hugh and the crisis. Their early findings helped win Idra Voss over.</p></div><div class=\"thread open\"><div class=\"st\">Uneasy truce?</div><h3>The Ashgate Watch</h3><p>The party murdered members of the <a class=\"wl\" href=\"#ashgate-watch\">Ashgate Watch</a> to get <a class=\"wl\" href=\"#urzel-the-radiant\">Urzel</a> into the city. Now Idra Voss says the heroes should never have been hunted like dogs. The Watch's Lord Warden, Brannoch Hale, is not so sure.</p></div><div class=\"thread open\"><div class=\"st\">Loose</div><h3>Demons that got away</h3><p>Some <a class=\"wl\" href=\"#pitling\">pitlings</a> and a <a class=\"wl\" href=\"#ruinant\">Ruinant</a> scampered off into the dark tunnels during the fight in the Cistern.</p></div><div class=\"thread closed\"><div class=\"st\">Safe in Session 4</div><h3>Bertrude and Torr</h3><p><a class=\"wl\" href=\"#bertrude\">Bertrude</a> and <a class=\"wl\" href=\"#torr\">Torr</a> talked the guard away from <a class=\"wl\" href=\"#annabel-swordbuck\">Annabel</a>'s hide without a fight and waited for the others at <a class=\"wl\" href=\"#the-tail-and-claw\">the Tail and Claw</a>.</p></div><div class=\"thread closed\"><div class=\"st\">Paid in Session 4</div><h3>Annabel's bargain</h3><p>The party got Annabel's crew through the sewers, and she told them what she knew about Hugh.</p></div><div class=\"thread closed\"><div class=\"st\">Answered in Session 3</div><h3>Something is off in Sanctuary City</h3><p>Sanctuary City is under assault by <a class=\"wl\" href=\"#demons\">Demons</a>. That is why no one goes into the sewers and why everything in the city has gone astray.</p></div>", "backlinks": ["overview"], "search": "open threads what the party is carrying unresolved after session 4."}, {"id": "session-1", "title": "Session 1 — The Road to Sanctuary", "group": "Sessions", "type": "doc", "typeLabel": "Session", "layout": "prose", "dek": "Session recap — safe to share with the table.", "conf": "", "confLabel": "", "player": "", "aliases": [], "image": "", "html": "<h2>Leaving Broadhurst</h2><p>The party set out from <a class=\"wl\" href=\"#broadhurst\">Broadhurst</a>, bound for <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>.</p><h2>Refugees on the Road</h2><p>On the road they fell in with refugees heading the same way, hopeful of what they would find in Sanctuary City.</p><h2>The Gates</h2><p>At the city gates the party was interrogated and split up.</p><h2>Something Is Off</h2><p>Inside, something about <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a> did not sit right.</p><h2>The Side Gate</h2><p>The party played out a scene at a side gate into the city.</p><h2>Getting Urzel In</h2><p>The party found <a class=\"wl\" href=\"#the-tail-and-claw\">the Tail and Claw</a> and interacted with the city's criminal elements. They stole some uniforms, and they murdered members of the <a class=\"wl\" href=\"#ashgate-watch\">Ashgate Watch</a> in order to sneak <a class=\"wl\" href=\"#urzel-the-radiant\">Urzel</a> into the city.</p>", "backlinks": [], "search": "session 1 — the road to sanctuary session recap — safe to share with the table."}, {"id": "session-2", "title": "Session 2 — Into the Alleys", "group": "Sessions", "type": "doc", "typeLabel": "Session", "layout": "prose", "dek": "Session recap — safe to share with the table.", "conf": "", "confLabel": "", "player": "", "aliases": [], "image": "", "html": "<h2>Alarm Bells</h2><p>The killings did not go unnoticed. Alarm bells rang, the rest of the <a class=\"wl\" href=\"#ashgate-watch\">Ashgate Watch</a> was alerted, and the party fled into the back alleys of <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>.</p><h2>Through the Back Alleys</h2><p>A chase through the alleys followed, and the party escaped the Watch.</p><h2>The Bolt Hole</h2><p>The party found <a class=\"wl\" href=\"#annabel-swordbuck\">Annabel Swordbuck</a> in a smuggler's bolt hole.</p><h2>As Recalled at the Table</h2><p>At the start of <a class=\"wl\" href=\"#session-3\">Session 3</a> the players remembered a few more details. <a class=\"wl\" href=\"#malthazar\">Malthazar</a> was lost along the way during the chase. The others met <a class=\"wl\" href=\"#bertrude\">Bertrude</a>, got past a few checkpoints, and went down a storm drain into the canals, where they ran into the criminals at the hide.</p>", "backlinks": [], "search": "session 2 — into the alleys session recap — safe to share with the table."}, {"id": "session-3", "title": "Session 3 — The Cistern", "group": "Sessions", "type": "doc", "typeLabel": "Session", "layout": "prose", "dek": "Session recap — safe to share with the table.", "conf": "", "confLabel": "", "player": "", "aliases": [], "image": "", "html": "<h2>Where Malthazar Went</h2><p><a class=\"wl\" href=\"#malthazar\">Malthazar</a> had vanished during the chase through the back alleys. As he tells it, he caught sight of three thieves robbing a lone girl who looked like a rich man's daughter. He decided that couldn't happen on his watch, beat up all three, and then stole her money himself. By then he had lost the others.</p><p>He turned up at the door of <a class=\"wl\" href=\"#annabel-swordbuck\">Annabel</a>'s hide shoving coins through the peephole, and her crew let him in. Money buys everything in a place like that.</p><p>The <a class=\"wl\" href=\"#ashgate-watch\">Ashgate Watch</a> had been talking too. Guards were claiming they'd seen individuals with wings, and it had frightened them.</p><h2>The Hide Is Raided</h2><p>Annabel introduced the party to her crew: three or four people, all nicknames and sideways glances, with a squat, gruff dwarf at her side who cared more about her safety than about anything in the street.</p><p>Then came a pounding at the only door: \"Open up, it's the guard!\" When the party looked round, Annabel and her crew had vanished. <a class=\"wl\" href=\"#torr\">Torr</a> tried to talk the guard away through the door (\"we're all very tired in here\") and got nowhere. <a class=\"wl\" href=\"#aurelion\">Aurelion</a> searched for where Annabel had gone and found nothing. Something heavier than a boot started breaking the door in.</p><p>Malthazar, who knows a thing or two about how smugglers build these places, found a false door hidden behind crates and worked out the mechanism just in time. The party slipped out, leaving behind a hide full of jewels, gems, weapons, drugs and booze. As the door fell in, <a class=\"wl\" href=\"#bertrude\">Bertrude</a> and Torr shouted for the others to go on ahead while they held the door.</p><h2>Annabel's Bargain</h2><p>The tunnel led into the <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a> sewers. <a class=\"wl\" href=\"#urzel-the-radiant\">Urzel</a>, whose god is a god of fire and light, conjured a floating ball of light to see by.</p><p>They soon caught up with Annabel and her gang. She was not pleased. It was because of the party that the guard had found her hide, and months of smuggling work were gone. Then, with a glance behind her into the dark, she told them that things are amiss in Sanctuary City. The hide was so full because her people no longer trust the sewers: every group they send down doesn't come back. Her price was to have the party get her crew through the sewers, and maybe then they could talk.</p><h2>The Cistern</h2><p>Hours of winding tunnels followed, with strange noises growing more frequent, until the party heard rushing water ahead. Annabel's crew hung back. Malthazar scouted ahead by sliding into the putrid sewage.</p><p>What he found was <a class=\"wl\" href=\"#the-cistern\">a cistern</a> full of <a class=\"wl\" href=\"#demons\">Demons</a>. None of the heroes had ever faced a demon before:</p><ul><li><a class=\"wl\" href=\"#pitling\">Pitlings</a> — stinking little things with many tongues and bodies split open, spitting acid.</li><li><a class=\"wl\" href=\"#ruinant\">Ruinants</a> — the captains, each leading a pack.</li><li><a class=\"wl\" href=\"#frenzied\">Frenzied</a> — fast, with huge claws and many teeth.</li><li><a class=\"wl\" href=\"#torlas\">Torlases</a> — they turned the floor to spongy flesh and dragged Aurelion back and forth through it like a game of ping pong.</li><li>A <a class=\"wl\" href=\"#bendrak\">Bendrak</a> — like a horse with a strange head and gems floating around its body, which warped the heroes' perceptions and turned their blows against each other.</li></ul><p>The fight was long and brutal. The demons proved weak to holy power. Twice a frenzied split and cracked open from within to become a new ruinant. Malthazar hid up in the piping and planted a sticky bomb on the bendrak, which eventually died in one last attempt to bend Aurelion's mind.</p><h2>\"Finish These Fools\"</h2><p>A rumbling came from the centre of the cistern, then a voice, clear as day: \"Finish these fools.\" Shapes rose from the water and hid among the pillars: <a class=\"wl\" href=\"#fiktin\">fiktins</a>, humanoid figures made of dripping, oily blood, the strongest creatures the party had faced. The remaining pitlings and a ruinant scampered off into the dark tunnels.</p><p>The party split up to explore while the fiktins hunted them:</p><ul><li><strong>The edge.</strong> From the catwalk, Aurelion saw the water pour into a sinkhole that looked less like a sewer than a pit into another world. A woman's body, wrapped in rags, drifted over the edge and dwindled to a pinprick.</li><li><strong>The bodies.</strong> On a ledge lay an enormous mound of corpses, apparently being prepared to go over the edge. A fiktin burst from the rags of one of them.</li><li><strong>The controls.</strong> Urzel found sluice controls and drained the cistern. A rock that had been sliding around underwater turned out to be another fiktin.</li></ul><p>The fiktins fought to the death, as though their lives had been ordered forfeit, and fell.</p><h2>The Mawblade</h2><p>Among the bodies, wrapped in rags and kept apart from everything else bound for the edge, the party found a blade of black iron whose edge is lined with ivory teeth: <a class=\"wl\" href=\"#the-mawblade\">the Mawblade</a>. There is more to learn about it.</p><h2>What It Means</h2><p>Sanctuary City is under assault by demons. That is why no one goes into the sewers, why strange bodies are being pulled out of the canals, and why everything in the city has gone astray. At the table the heroes suspected that someone is controlling the demons.</p>", "backlinks": ["ashgate-watch", "bendrak", "demons", "fiktin", "frenzied", "pitling", "ruinant", "sanctuary-city", "session-2", "the-cistern", "the-mawblade", "torlas"], "search": "session 3 — the cistern session recap — safe to share with the table."}, {"id": "session-4", "title": "Session 4 — The Shadow Comes Loose", "group": "Sessions", "type": "doc", "typeLabel": "Session", "layout": "prose", "dek": "Session recap — safe to share with the table.", "conf": "", "confLabel": "", "player": "", "aliases": [], "image": "", "html": "<h2>Holding the Door</h2><p>Back at <a class=\"wl\" href=\"#annabel-swordbuck\">Annabel</a>'s hide, <a class=\"wl\" href=\"#torr\">Torr</a> and <a class=\"wl\" href=\"#bertrude\">Bertrude</a> never had to fight. When the guard broke the door in, Torr complained that they were all very tired and asked whether the guard couldn't see that people were trying to sleep. The guard tore the place apart and found nothing. Bertie's mind tricks made the whole act convincing, and after a lot of questions Torr told them to kindly leave. They did. After the murders at the gate, the party could use a little restraint.</p><p>The two of them made their way back to <a class=\"wl\" href=\"#the-tail-and-claw\">the Tail and Claw</a>, the party's base of operations, and waited. Going into the sewers as a pair would have been unwise.</p><h2>Back at the Tail and Claw</h2><p>Long after Torr had pulled up a seat, the others came through the door: wet, haggard, filthy and stinking. <a class=\"wl\" href=\"#urzel-the-radiant\">Urzel</a> was delighted. Down below was a creature worth the challenge, and his god would be proud of the blood they spilled.</p><p>Annabel and her crew came with them. They had got her people through the sewers as promised. She went straight to the bar, ordered from the top shelf, spilled a bag of coins on the counter and told the barkeep to keep them coming. Then she buried herself in a bottle of wine. She flicked something disgusting off Urzel's shoulder and admitted that she thought she'd known everything, but the last few hours had shaken her. What were those things? Urzel told her he'd seen demons before: creatures of the night, coming out.</p><p>Her crew were just as deep in their cups. Her offsider, the dwarf, has the stone-like skin that dwarves in this realm are known for. He shook his head slightly, but she talked anyway.</p><h2>Hugh's Patron</h2><p>Annabel knew about the party's friend <a class=\"wl\" href=\"#hugh\">Hugh</a>. He'd been making quite the scene for himself in <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>, and she hadn't been lying when she said she could help them find his patron. Hugh has friends in high places, perhaps the highest in the city. After the last few hours, though, she wasn't sure her information was worth anything any more, and she needed to confer with her colleagues.</p><p>She took <a class=\"wl\" href=\"#malthazar\">Malthazar</a>, who knows his way around the criminal element, on a scouting mission. He nodded sagely and wrapped his wings around himself. Her parting advice was that the rest of the party needed an audience with the council. Once she'd gone, the barkeep whistled from behind the bar. The <a class=\"wl\" href=\"#economic-council\">Economic Council</a>, he said, is a greedy bunch that rules this town. But if anyone could get an audience with them, it was this lot.</p><h2>The City Burns</h2><p>The party took a respite. They woke the next morning to news that churches and holy sites had been attacked in the night by hooded figures. People were talking about cult activity, and there were fires all over the city, with the smoke hanging thick. The <a class=\"wl\" href=\"#ashgate-watch\">Ashgate Watch</a> ran about more determined than ever to force control on a city that had started, ever so slightly, to slip.</p><h2>Getting an Audience</h2><p>The Economic Council is rumoured to be four people, possibly more, and secrecy surrounds it. It sits in <a class=\"wl\" href=\"#the-commerce-hall\">the Commerce Hall</a> at the centre of the city, with the Watch wrapped tight around it. Getting in took some work:</p><ul><li><strong>The one honest man.</strong> Torr tried to bribe a mid-level bureaucrat who collects taxes in the market. Against all odds, Torr had found the one straight official in the city. He clutched his pearls at the very idea, and the party beat a hasty retreat before he could call the guard.</li><li><strong>Tailing him.</strong> Urzel followed him. The bureaucrat knew he was being watched and was no fool, but his errands showed the party his chain of command. His report would carry weight up that chain.</li><li><strong>The dice den.</strong> <a class=\"wl\" href=\"#aurelion\">Aurelion</a> found part of that chain of command a few flights of stairs below ground, in a dank den of pipe smoke and sickly sweet drugs, rolling dice in the corner. He offered a wager: if he lost, the party would do some dirty work for them; if he won, they'd help him reach the people at the top. The gamblers bowed their heads reverently to Urzel, took the bet and promptly lost. They gave up the council's schedule. Most of its engagements had been cancelled, but it was certainly still meeting in the Commerce Hall.</li><li><strong>\"Gruul the One-Handed.\"</strong> At the compound gate, Urzel told the guards that there is a darkness in this city, and that his god had sent him to cleanse it. Not every Ashgate guardsman is pious, but this one was. He took Urzel seriously in such troubled times and escorted the three of them through the compound himself. Beyond the massive doors, a little servant in a vest played a trumpet as they walked past.</li><li><strong>Big-time players.</strong> With Torr's help, Aurelion talked his way through yet more layers of bureaucracy: up the stairs, down the corridors, to an inner sanctum with still more people barring the way. The party were heroes, he said. They knew what was happening in the sewers and they wanted to help. \"We've heard of people like you coming through the gates lately.\" The door opened a crack and a face appeared. After some whispering, they were let in.</li></ul><h2>The Council Chamber</h2><p>Four people waited inside:</p><ul><li><a class=\"wl\" href=\"#idra-voss\">High Chancellor Idra Voss</a>, looking up from an endless scroll that tumbled off the table in front of her.</li><li><a class=\"wl\" href=\"#brannoch-hale\">Brannoch Hale</a>, in resplendent polished armour, with a withering stare and the badge of the Ashgate Watch on his chest.</li><li><a class=\"wl\" href=\"#lucan-fairweather\">Lucan Fairweather</a>, podgy, with rings on his fingers and wine-stained lips. He tut-tutted when they came in and wouldn't look at them.</li><li><a class=\"wl\" href=\"#orsolya-venn\">Orsolya Venn</a>, robed in yellow with religious inscriptions and emblems of office: the Prelate of <a class=\"wl\" href=\"#the-gilded-scale\">the Gilded Scale</a>.</li></ul><p>Attendants scuttled about with scrolls and wine, and elite guards stood at the doors.</p><h2>The Negotiation</h2><p>Urzel opened by saying that their dear friend Hugh had sent for them to help the city. Idra Voss had no idea who that was. But Urzel was watching the room, and he saw Lucan Fairweather hiccup at the name.</p><p>Torr then raised the creatures in the sewers. At that, Idra clapped twice and the attendants left the room, along with even some of the guards. She was behind schedule and fidgeting with her jewellery, eyeing the ornate clock on the wall. But she was interested. She also knew exactly who they were: outsiders who came through the Ashgate a few nights ago.</p><p>Then Aurelion reached behind his back and drew <a class=\"wl\" href=\"#the-mawblade\">the Mawblade</a>. \"Does this interest you?\" It did. Idra's eyes sparkled, and so did her attendants'. Brannoch Hale was on his feet, reaching for the hilt of his own weapon. How dare they brandish a weapon in front of the council, and <em>that</em> thing of all items. Where had they found it? What was its nature?</p><p>Urzel stepped in front of the Lord Warden. Brannoch barred people of great religion and great light from entering, Urzel said, so either he knew more about what was going on in this city than he was letting on, or he was a fool.</p><p>Idra laid a hand on Brannoch's shoulder to cool things down. Her patience was nearly gone, so the party called in a favour. <a class=\"wl\" href=\"#annabel-swordbuck\">Annabel</a> and Malthazar's early scouting had turned up something useful: a statue of Idra is going up in <a class=\"wl\" href=\"#grain-square\">Grain Square</a>, and it's enormous. She is vain, and her legacy matters to her. Urzel made his last pitch. Help the heroes defeat this great evil, and she'd be remembered as the saviour of the city and one of the greatest rulers who ever lived. Torr added that forgiveness can be found in gold.</p><h2>\"I Signed a Deal with a Demon\"</h2><p>The theatrics were over. Idra sat down, made Brannoch sit as well, and took a few deep breaths. \"It's true,\" she said. Brannoch and Lucan turned to look at her. Orsolya did not.</p><p>\"The city has an infestation, and I know what it is.\" Brannoch shook his head and told her to trust the Ashgate Watch, that they could deal with it, and that she didn't have to sell herself out in front of these people. She ignored him. \"I signed a deal with a demon many moons ago.\"</p><p>At the word <em>demon</em>, the candlelit room went dark and a breath of wind pushed through it.</p><p>She can never confess it in public; that is part of the bargain. Seasons ago, what seemed like a trifling deal saved the city from ruin and starvation. Now the demon, <a class=\"wl\" href=\"#harkonex\">Harkonex</a>, has proved insatiable, and it's getting out of hand. She admitted they should never have hunted the heroes through the streets like dogs. She asked their forgiveness and their help to save the city before it dies.</p><h2>The Shadow in the Room</h2><p>Idra is perceptive too. She turned to Lucan, who still hadn't met anyone's eye, and asked him to tell them who this Hugh is. Against his better judgement, Lucan started to talk.</p><p>Orsolya Venn cut him off. The wind came back tenfold and blew the scrolls off the table. Orsolya wavered in front of them, and her shadow came away from her body and fragmented across the room as she began to chant a spell.</p><p>The session ended there, on the edge of a fight.</p>", "backlinks": ["economic-council", "grain-square", "idra-voss", "hugh", "sanctuary-city", "the-commerce-hall", "the-tail-and-claw"], "search": "session 4 — the shadow comes loose session recap — safe to share with the table."}, {"id": "aurelion", "title": "Aurelion", "group": "Heroes", "type": "hero", "typeLabel": "Hero", "layout": "prose", "dek": "Human censor of the Paragon order, once a watch officer. Level 2.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Aurelian", "Aurelien", "Arulian", "Rulian", "Rullian"], "image": "", "html": "<h2>At a Glance</h2><ul><li><strong>Ancestry:</strong> Human</li><li><strong>Class:</strong> Censor — Paragon order, Fate domain</li><li><strong>Career:</strong> Watch Officer</li><li><strong>Culture:</strong> Human — urban, communal, labor upbringing</li><li><strong>Level:</strong> 2 · Wealth 1 · Renown 0</li></ul><h2>Characteristics</h2><ul><li><strong>Might</strong> 2 · <strong>Agility</strong> −1 · <strong>Reason</strong> 1 · <strong>Intuition</strong> 1 · <strong>Presence</strong> 2</li><li><strong>Stamina</strong> 39 (winded at 19) · <strong>Recoveries</strong> 14, recovering 13 Stamina each</li><li><strong>Speed</strong> 5 · <strong>Size</strong> 1M · <strong>Stability</strong> 2 · <strong>Disengage</strong> 1</li><li><strong>Heroic resource:</strong> Wrath</li><li><strong>Kit:</strong> Mountain — heavy weapon, heavy armor (+4 melee damage at tier 3)</li></ul><h2>Inciting Incident — Powerful Enemies</h2><p>Aurelion made it their responsibility to root out and bring down the region's foremost crime syndicate. The syndicate sent goons to burn down their home and teach them a lesson, leaving them bleeding in the street with nothing left but their life. They have since taken on the life of a hero to gain the power and influence needed to destroy the syndicate once and for all.</p><h2>Languages</h2><p>Caelian, Szetch, Vaslorian, Zaliac.</p><h2>Skills</h2><p>Climb, Endurance, Jump, Lift, Lead, Intimidate, Read Person, Search, Religion.</p><h2>Traits and Perks</h2><ul><li><strong>Detect the Supernatural</strong> and <strong>Resist the Unnatural</strong> — human ancestry traits; <strong>Staying Power</strong> grants +2 Recoveries.</li><li><strong>Team Leader</strong> — spend a hero token at the start of a group or montage test so every participant tests as if they had the hero's exploration skills.</li><li><strong>Engrossing Monologue</strong> — outside combat, shout to hold the attention of non-hostile creatures within 10 squares; allies gain an edge to avoid being noticed while they listen.</li></ul><h2>Class Features</h2><ul><li><strong>Judgment</strong> — a prayer that outlines a foe in holy energy and punishes it for acting.</li><li><strong>My Life for Yours</strong> — spend a Recovery to let yourself or an ally regain Stamina.</li><li><strong>Lead by Example</strong> and <strong>Stalwart Example</strong> — the gods' favour helps allies flank and aids tests to intimidate or persuade.</li></ul><h2>Abilities</h2><ul><li><strong>Pain for Pain</strong> (signature) — \"An enemy who tagged you will pay for that.\"</li><li><strong>Your Allies Cannot Save You!</strong> (signature) — a holy strike that shoves the target's adjacent allies away.</li><li><strong>The Gods Punish and Defend</strong> (3 Wrath) — smite a foe and heal an ally.</li><li><strong>Arrest</strong> (5 Wrath) — \"I got you, you son of a bitch.\"</li><li><strong>Blessing of the Faithful</strong> (5 Wrath) — an aura granting surges to allies.</li></ul>", "backlinks": ["bendrak", "brannoch-hale", "overview", "timeline", "threads", "session-3", "session-4", "the-mawblade", "torlas"], "search": "aurelion aurelian aurelien arulian rulian rullian human censor of the paragon order, once a watch officer. level 2."}, {"id": "bertrude", "title": "Bertrude", "group": "Heroes", "type": "hero", "typeLabel": "Hero", "layout": "prose", "dek": "Human telepath and disavowed agent. Level 2.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Birdie", "Bertred"], "image": "", "html": "<div class=\"panel note\"><div class=\"ph\">Name on the sheet</div><p>The character name field on the Forge Steel sheet is blank. The Director calls her Bertrude at the table, and she likes to be called Bertie.</p></div><h2>At a Glance</h2><ul><li><strong>Ancestry:</strong> Human</li><li><strong>Class:</strong> Talent — Telepathy tradition</li><li><strong>Career:</strong> Agent</li><li><strong>Culture:</strong> Bespoke — secluded, bureaucratic, academic upbringing</li><li><strong>Level:</strong> 2 · Wealth 1 · Renown 0</li></ul><h2>Characteristics</h2><ul><li><strong>Might</strong> −1 · <strong>Agility</strong> 1 · <strong>Reason</strong> 2 · <strong>Intuition</strong> 1 · <strong>Presence</strong> 2</li><li><strong>Stamina</strong> 24 (winded at 12) · <strong>Recoveries</strong> 10, recovering 8 Stamina each</li><li><strong>Speed</strong> 5 · <strong>Size</strong> 1M · <strong>Stability</strong> 0 · <strong>Disengage</strong> 1</li><li><strong>Heroic resource:</strong> Clarity</li><li><strong>Augmentation:</strong> Distance Augmentation (+2 distance to ranged psionic abilities)</li><li><strong>Ward:</strong> Repulsive Ward</li></ul><h2>Inciting Incident — Disavowed</h2><p>On a dangerous espionage assignment, things went sideways. Bertrude escaped with their life, but the mission was a public failure thanks to bad information their agency gave them. The agency denied they worked for it, and Bertrude went on the run. Hero work will let them survive and clear their name.</p><h2>Languages</h2><p>Caelian, Hyrallic, Mindspeech, Vaslorian, Yllyric.</p><h2>Skills</h2><p>Empathize, Flirt, Lie, Persuade, Disguise, Search, Sneak, Magic, Psionics, Timescape.</p><h2>Traits and Perks</h2><ul><li><strong>Detect the Supernatural</strong> and <strong>Resist the Unnatural</strong> — human ancestry traits; <strong>Staying Power</strong> grants +2 Recoveries.</li><li><strong>Forgettable Face</strong> — after ten minutes or less with someone new, they can be made to forget your face; disguises come easily.</li></ul><h2>Class Features</h2><ul><li><strong>Telepathic Speech</strong> — speak mind to mind with any creature within Mind Spike's range that shares a language.</li><li><strong>Ease the Mind</strong> — an edge on tests to stop combat and start a negotiation, and hostile or suspicious NPCs have more patience.</li><li><strong>Mind Spike</strong> — a telepathic bolt that instantly zaps a creature's brain.</li><li><strong>Remote Assistance</strong> — an ally gains the benefit of your intellect.</li><li><strong>Feedback Loop</strong> — a brief psychic link gives an enemy a taste of its own medicine.</li></ul><h2>Abilities</h2><ul><li><strong>Kinetic Grip</strong> (signature) — lift and hurl a foe away.</li><li><strong>Kinetic Pulse</strong> (signature) — the force of your mind hurls enemies backward.</li><li><strong>Awe</strong> (3 Clarity) — project psionic energy and take on a new visage in a creature's mind.</li><li><strong>Flashback</strong> (5 Clarity) — throw a target several seconds back through time so it can act again.</li></ul>", "backlinks": ["ashgate-watch", "overview", "timeline", "threads", "session-2", "session-3", "session-4", "the-tail-and-claw"], "search": "bertrude birdie bertred human telepath and disavowed agent. level 2."}, {"id": "malthazar", "title": "Malthazar", "group": "Heroes", "type": "hero", "typeLabel": "Hero", "layout": "prose", "dek": "Dragon knight shadow of the College of Caustic Alchemy, with a criminal past. Level 2.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Malthasar", "Malfazel", "Mothazel", "Balthazar", "Mouth Desire"], "image": "", "html": "<h2>At a Glance</h2><ul><li><strong>Ancestry:</strong> Dragon Knight</li><li><strong>Class:</strong> Shadow — College of Caustic Alchemy</li><li><strong>Career:</strong> Criminal</li><li><strong>Culture:</strong> Bespoke — nomadic, communal, lawless upbringing</li><li><strong>Level:</strong> 2 · Wealth 1 · Renown 1</li></ul><h2>Characteristics</h2><ul><li><strong>Might</strong> −1 · <strong>Agility</strong> 2 · <strong>Reason</strong> 2 · <strong>Intuition</strong> 2 · <strong>Presence</strong> −1</li><li><strong>Stamina</strong> 24 (winded at 12) · <strong>Recoveries</strong> 8, recovering 8 Stamina each</li><li><strong>Speed</strong> 5 (fly) · <strong>Size</strong> 1M · <strong>Stability</strong> 0 · <strong>Disengage</strong> 1</li><li><strong>Heroic resource:</strong> Insight</li><li><strong>Immunity:</strong> Fire 2</li><li><strong>Kit:</strong> none recorded on the sheet</li></ul><h2>Inciting Incident — Atonement</h2><p>The last criminal job Malthazar pulled led to the death of someone, or the destruction of something, they loved. To make up for the loss, they left their criminal ways behind and became a hero.</p><h2>Languages</h2><p>Caelian, Vastariax, and I Speak Their Language (Criminal).</p><h2>Skills</h2><p>Alchemy, Forgery, Mechanics, Gymnastics, Navigate, Lie, Intimidate, Read Person, Disguise, Eavesdrop, Sabotage, Sneak, Track, Criminal Underworld.</p><h2>Traits and Perks</h2><ul><li><strong>Wings</strong> — fly for a number of rounds equal to Might (minimum 1). While flying at levels 1–3, Malthazar has damage weakness 5.</li><li><strong>Draconian Guard</strong> — swing the wings round to guard against a blow.</li><li><strong>Lucky Dog</strong> — after failing an intrigue test, lose Stamina to improve the outcome by one tier.</li><li><strong>Criminal Contacts</strong> — during a respite in a settlement, ask the local criminal network a question.</li></ul><h2>Class Features</h2><ul><li><strong>Trained Assassin</strong> — an extra surge on strikes that use surges.</li><li><strong>Smoke Bomb</strong> — hide even when observed, then shift away.</li><li><strong>Coat the Blade</strong> — \"A little poison goes a long way.\"</li><li><strong>Hesitation Is Weakness</strong> — take a turn straight after another hero.</li><li><strong>Defensive Roll</strong> — roll with an enemy's attack to reduce the harm.</li><li><strong>Sticky Bomb</strong> — explosives are best when they're attached to an enemy.</li></ul><h2>Abilities</h2><ul><li><strong>Teamwork Has Its Place</strong> (signature) — attack an enemy as an ally exposes its weakness.</li><li><strong>Get In Get Out</strong> (3 Insight) — move unexpectedly, strike fast and be gone.</li><li><strong>One Hundred Throats</strong> (5 Insight) — move across the battlefield and strike every foe within reach.</li></ul>", "backlinks": ["annabel-swordbuck", "overview", "timeline", "grain-square", "threads", "session-2", "session-3", "session-4"], "search": "malthazar malthasar malfazel mothazel balthazar mouth desire dragon knight shadow of the college of caustic alchemy, with a criminal past. level 2."}, {"id": "torr", "title": "Torr", "group": "Heroes", "type": "hero", "typeLabel": "Hero", "layout": "prose", "dek": "High elf tactician of the Mastermind doctrine, raised among the Wode Elves. Level 2.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Tor"], "image": "", "html": "<h2>At a Glance</h2><ul><li><strong>Ancestry:</strong> High Elf</li><li><strong>Class:</strong> Tactician — Mastermind doctrine</li><li><strong>Career:</strong> Laborer</li><li><strong>Culture:</strong> Wode Elf — wilderness, bureaucratic, martial upbringing</li><li><strong>Level:</strong> 2 · Wealth 1 · Renown 0</li></ul><h2>Characteristics</h2><ul><li><strong>Might</strong> 2 · <strong>Agility</strong> −1 · <strong>Reason</strong> 2 · <strong>Intuition</strong> 1 · <strong>Presence</strong> 1</li><li><strong>Stamina</strong> 42 (winded at 21) · <strong>Recoveries</strong> 10, recovering 14 Stamina each</li><li><strong>Speed</strong> 6 · <strong>Size</strong> 1M · <strong>Stability</strong> 1 · <strong>Disengage</strong> 2</li><li><strong>Heroic resource:</strong> Focus</li><li><strong>Kits:</strong> Shining Armor and Sniper (Field Arsenal) — medium weapon, bow, heavy armor</li><li><strong>Immunity:</strong> Dazed (Unstoppable Mind)</li></ul><h2>Inciting Incident — Disaster</h2><p>A disaster hit Torr's crew while they were working. Torr saved as many as they could, but the ones they couldn't save weigh heavily on their mind. They took up the life of a hero to save as many people as possible, vowing that what happened would not happen again.</p><h2>Languages</h2><p>Caelian, Ullorvic, Yllyric.</p><h2>Skills</h2><p>Cooking, Drive, Endurance, Gymnastics, Navigate, Lead, Persuade, Alertness, Criminal Underworld, Strategy.</p><h2>Traits and Perks</h2><ul><li><strong>High Senses</strong> — an edge on tests to notice threats.</li><li><strong>High Elf Glamor</strong> — an edge on Presence tests using Flirt or Persuade; Torr appears slightly different to each observer, but always as themselves.</li><li><strong>Unstoppable Mind</strong> — immune to dazed.</li><li><strong>Teamwork</strong> — on the first turn of a montage test, make a test and assist another hero's.</li><li><strong>Danger Sense</strong> — in natural environments, an edge on Alertness, can't be surprised, and a warning of imminent natural disaster.</li></ul><h2>Class Features</h2><ul><li><strong>Studied Commander</strong> — knowledge of battle makes war lore projects cheaper and can reveal what an encounter or negotiation holds.</li><li><strong>Mark</strong> — draw allies' attention to a specific foe.</li><li><strong>\"Strike Now!\"</strong> — point out an opening to an ally.</li><li><strong>Overwatch</strong> — an ally waits for the right moment to strike.</li><li><strong>Goaded</strong> — goad marked foes into acting before they're ready.</li></ul><h2>Abilities</h2><ul><li><strong>Patient Shot</strong> (signature) — \"Breathe ... aim ... wait ... then strike!\"</li><li><strong>Protective Attack</strong> (signature) — a strike that makes it impossible for the foe to ignore you.</li><li><strong>Concussive Strike</strong> (3 Focus) — a precise strike that leaves the foe struggling to respond.</li><li><strong>I've Got Your Back</strong> (5 Focus) — the enemy will think twice about attacking your friend.</li><li><strong>This Is What We Planned For</strong> (5 Focus) — all those coordination drills finally pay off.</li></ul>", "backlinks": ["ashgate-watch", "overview", "timeline", "threads", "session-3", "session-4", "the-tail-and-claw"], "search": "torr tor high elf tactician of the mastermind doctrine, raised among the wode elves. level 2."}, {"id": "urzel-the-radiant", "title": "Urzel the Radiant", "group": "Heroes", "type": "hero", "typeLabel": "Hero", "layout": "prose", "dek": "Orc conduit of the Life and Sun domains. Level 2.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Urzul"], "image": "", "html": "<h2>At a Glance</h2><ul><li><strong>Ancestry:</strong> Orc</li><li><strong>Class:</strong> Conduit — Life and Sun domains</li><li><strong>Career:</strong> Disciple</li><li><strong>Culture:</strong> Orc — wilderness, communal, creative upbringing</li><li><strong>Level:</strong> 2 · Wealth 1 · Renown 1</li></ul><h2>Characteristics</h2><ul><li><strong>Might</strong> 1 · <strong>Agility</strong> −1 · <strong>Reason</strong> 1 · <strong>Intuition</strong> 2 · <strong>Presence</strong> 2</li><li><strong>Stamina</strong> 30 (winded at 15) · <strong>Recoveries</strong> 8, recovering 10 Stamina each</li><li><strong>Speed</strong> 5 · <strong>Size</strong> 1M · <strong>Stability</strong> 2 · <strong>Disengage</strong> 1</li><li><strong>Heroic resource:</strong> Piety</li><li><strong>Prayer:</strong> Prayer of Steel · <strong>Ward:</strong> Bastion Ward (+1 to saving throws)</li><li><strong>Immunity:</strong> Slowed (Nonstop)</li></ul><h2>Inciting Incident — Dogma</h2><p>Urzel joined a religious institution under the guidance of a kind mentor, but others in the house of worship grew increasingly fanatical. The mentor tried to be a voice of reason, and was tried as a heretic and executed. Urzel left the institution and became a hero to uphold the beliefs they hold dear.</p><h2>Faith</h2><p>At the table Urzel calls his god a god of fire and light, and prays to a one-armed god. In Session 4 he called him \"Gruul, the One-Handed\" at the council's gate, and \"Gorr\" when boasting at the Tail and Claw. The Director says \"Groll\". The spelling isn't confirmed yet. His god cares for blood and passion, and wants death.</p><h2>Languages</h2><p>Caelian, Kalliac.</p><h2>Skills</h2><p>Climb, Endurance, Jump, Perform, Persuade, Read Person, Criminal Underworld, Culture, Magic, Religion.</p><h2>Traits and Perks</h2><ul><li><strong>Relentless</strong> — when knocked to dying, make a free strike; dropping a foe lets Urzel spend a Recovery.</li><li><strong>Nonstop</strong> — immune to slowed. <strong>Grounded</strong> — +1 Stability.</li><li><strong>Ritualist</strong> — a one-minute blessing gives a double edge on the target's next test.</li></ul><h2>Class Features</h2><ul><li><strong>Prayer</strong> — pray for extra piety at the risk of angering the gods.</li><li><strong>The Lists of Heaven</strong> — healing an ally lets Urzel spend a Recovery too.</li><li><strong>Revitalizing Ritual</strong> and <strong>Inner Light</strong> — respite blessings that boost recoveries and saving throws.</li><li><strong>Healing Grace</strong> — divine energy restores the righteous.</li><li><strong>Ray of Wrath</strong> — a blast of holy light.</li><li><strong>Word of Guidance</strong> — invigorate an attacking ally with divine energy.</li></ul><h2>Abilities</h2><ul><li><strong>Blessed Light</strong> (signature) — burning radiance that shares the target's energy with an ally.</li><li><strong>Drain</strong> (signature) — drain a target's energy to revitalise yourself or an ally.</li><li><strong>Judgment's Hammer</strong> (3 Piety) — divine fury crashes down upon the unrighteous.</li><li><strong>Morning Light</strong> (5 Piety) — burn foes and bless allies.</li><li><strong>Faith Is Our Armor</strong> (5 Piety) — the heroes' armour glows with golden light.</li></ul>", "backlinks": ["ashgate-watch", "brannoch-hale", "overview", "timeline", "lucan-fairweather", "threads", "session-1", "session-3", "session-4", "the-cistern"], "search": "urzel the radiant urzul orc conduit of the life and sun domains. level 2."}, {"id": "annabel-swordbuck", "title": "Annabel Swordbuck", "group": "People", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "An aloof elf smuggler, now the party's source on Hugh and the city's underworld.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Annabelle"], "image": "", "html": "<p>An aloof elf, not a Wode Elf, with a nasty habit of picking her teeth with a thin shard of bone. The party found her in her smuggler's hide in <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a> after escaping the <a class=\"wl\" href=\"#ashgate-watch\">Ashgate Watch</a>.</p><h2>Her Crew</h2><p>Three or four people who go by nicknames. Her right hand is a squat, gruff dwarf with the stone-like skin that dwarves in this realm have. He cares more about her safety than about anything going on in the street.</p><h2>Session 3</h2><p>When the guard raided the hide, Annabel and her crew slipped out through a false door and left the party behind. The hide held months of smuggling work, including jewels, gems, weapons, drugs and booze, and the raid cost her all of it. She blames the party.</p><p>She told them that things are amiss in <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>: her people no longer trust the sewers, because every group they send down doesn't come back. Her price was for the party to get her crew through the sewers, and maybe then they could talk. She and her crew hung back while the party went into <a class=\"wl\" href=\"#the-cistern\">the Cistern</a>.</p><h2>Session 4</h2><p>The party got her crew through the sewers as promised. Back at <a class=\"wl\" href=\"#the-tail-and-claw\">the Tail and Claw</a>, she drank top-shelf with a bag of coins on the bar and admitted that what she'd seen below had shaken her.</p><p>She knows about the party's friend <a class=\"wl\" href=\"#hugh\">Hugh</a>. He has friends in high places, perhaps the highest in the city, and she believes she can help find his patron. She went off scouting the city's criminal element with <a class=\"wl\" href=\"#malthazar\">Malthazar</a> and told the others to get an audience with the <a class=\"wl\" href=\"#economic-council\">Economic Council</a>. Despite being criminals, she and her people call this city home. Their early findings, including the statue of <a class=\"wl\" href=\"#idra-voss\">Idra Voss</a> going up in <a class=\"wl\" href=\"#grain-square\">Grain Square</a>, helped the party win the High Chancellor over.</p>", "backlinks": ["ashgate-watch", "overview", "timeline", "grain-square", "hugh", "threads", "session-2", "session-3", "session-4"], "search": "annabel swordbuck annabelle an aloof elf smuggler, now the party's source on hugh and the city's underworld."}, {"id": "brannoch-hale", "title": "Brannoch Hale", "group": "People", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Lord Warden of the Ashgate and the council member who commands the Watch.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Branick Hale", "Brannock Hale", "Brannock", "Veronica Hale"], "image": "", "html": "<p>A member of the <a class=\"wl\" href=\"#economic-council\">Economic Council</a> of <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>, in resplendent polished armour and with a withering stare. The badge on his chest marks him as the man responsible for the <a class=\"wl\" href=\"#ashgate-watch\">Ashgate Watch</a>, the Lord Warden of the Ashgate. Given how the party got into the city, he is not their biggest friend in the room.</p><h2>Session 4</h2><p>When <a class=\"wl\" href=\"#aurelion\">Aurelion</a> drew <a class=\"wl\" href=\"#the-mawblade\">the Mawblade</a> in the council chamber, Brannoch was on his feet at once with a hand on the hilt of his own weapon. \"How dare you brandish a weapon here in front of us. And that thing of all items.\" He wanted to know where they had found it and what its nature was. He seems to know something about it.</p><p><a class=\"wl\" href=\"#urzel-the-radiant\">Urzel</a> challenged him: either he knew more about what was going on in the city than he was letting on, or he was a fool.</p><p>When <a class=\"wl\" href=\"#idra-voss\">Idra Voss</a> began to confess, Brannoch tried to stop her. The Ashgate Watch could deal with this, whatever it was, and she didn't have to sell herself out in front of these people. She made him sit down and told them anyway.</p>", "backlinks": ["ashgate-watch", "timeline", "economic-council", "threads", "sanctuary-city", "session-4", "the-mawblade"], "search": "brannoch hale branick hale brannock hale brannock veronica hale lord warden of the ashgate and the council member who commands the watch."}, {"id": "harkonex", "title": "Harkonex", "group": "People", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "The demon High Chancellor Idra Voss struck a bargain with.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Harkonics"], "image": "", "html": "<p>The demon that <a class=\"wl\" href=\"#idra-voss\">High Chancellor Idra Voss</a> made a deal with many moons ago. In her words, Harkonex is \"just insatiable\".</p><p>The bargain was meant to save <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a> from ruin and starvation. It looked trifling seasons ago, but it's now getting out of hand: it is the infestation of <a class=\"wl\" href=\"#demons\">Demons</a> the party found beneath the city. Part of the bargain is that Idra can never confess it in public.</p><p>When she said the word <em>demon</em> in the council chamber, the candlelit room went dark and a breath of wind pushed through it.</p>", "backlinks": ["overview", "timeline", "demons", "economic-council", "idra-voss", "threads", "sanctuary-city", "session-4"], "search": "harkonex harkonics the demon high chancellor idra voss struck a bargain with."}, {"id": "idra-voss", "title": "High Chancellor Idra Voss", "group": "People", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Head of Sanctuary City's Economic Council, and the one who made a deal with a demon.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "image": "", "html": "<p>The High Chancellor of <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a> and head of the <a class=\"wl\" href=\"#economic-council\">Economic Council</a>. The party met her in the council chamber of <a class=\"wl\" href=\"#the-commerce-hall\">the Commerce Hall</a> in <a class=\"wl\" href=\"#session-4\">Session 4</a>, where she sat behind an endless scroll that tumbled off the table in front of her.</p><p>She is busy, impatient and perceptive. When her patience runs low she fidgets with her jewellery and watches the ornate clock on the wall. She knew who the party were before they spoke: outsiders who came through the Ashgate a few nights ago.</p><h2>What Moves Her</h2><p>The party found three things she cares about:</p><ul><li><strong>Protecting the city.</strong> The mention of creatures in the sewers was enough to make her clear the room.</li><li><strong>Power.</strong> Her eyes sparkled when Aurelion drew <a class=\"wl\" href=\"#the-mawblade\">the Mawblade</a>.</li><li><strong>Her legacy.</strong> She's vain. A statue of her, a very large one, is going up in <a class=\"wl\" href=\"#grain-square\">Grain Square</a>.</li></ul><h2>The Bargain</h2><p>Under pressure, she confessed to the party what she can never confess in public: many moons ago she signed a deal with a demon. Seasons ago, it seemed a trifling price to save the city from ruin and starvation. Now the demon, <a class=\"wl\" href=\"#harkonex\">Harkonex</a>, has proved insatiable and the infestation is getting out of hand. Keeping it secret is part of the bargain.</p><p>She told the heroes they should never have been hunted through the streets like dogs, asked their forgiveness, and asked for their help to save the city.</p><p>She also seems to suspect <a class=\"wl\" href=\"#lucan-fairweather\">Lucan Fairweather</a> knows more about <a class=\"wl\" href=\"#hugh\">Hugh</a> than he's saying, and asked him outright.</p>", "backlinks": ["annabel-swordbuck", "ashgate-watch", "brannoch-hale", "overview", "timeline", "demons", "economic-council", "grain-square", "harkonex", "hugh", "lucan-fairweather", "threads", "orsolya-venn", "sanctuary-city", "session-4", "the-mawblade"], "search": "high chancellor idra voss head of sanctuary city's economic council, and the one who made a deal with a demon."}, {"id": "hugh", "title": "Hugh", "group": "People", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "The party's friend, who made quite the scene in Sanctuary City and has a patron in high places.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": [], "image": "", "html": "<p>A friend of the heroes. He's the reason they wanted <a class=\"wl\" href=\"#annabel-swordbuck\">Annabel Swordbuck</a>'s help, and the name they used to talk their way in front of the <a class=\"wl\" href=\"#economic-council\">Economic Council</a>.</p><h2>What the Party Knows</h2><ul><li>He made quite the scene for himself in <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>.</li><li>He has friends in high places, perhaps the highest in the city. Annabel believes she can help find out who his patron is, and she thinks the Economic Council will know where he can be found.</li><li><a class=\"wl\" href=\"#idra-voss\">High Chancellor Idra Voss</a> had no idea who he was.</li><li><a class=\"wl\" href=\"#lucan-fairweather\">Lucan Fairweather</a> hiccupped at his name and wouldn't meet the party's eyes. When Idra asked Lucan to explain who Hugh is, he started to answer, and <a class=\"wl\" href=\"#orsolya-venn\">Orsolya Venn</a> interrupted. See <a class=\"wl\" href=\"#session-4\">Session 4</a>.</li></ul>", "backlinks": ["annabel-swordbuck", "overview", "timeline", "economic-council", "idra-voss", "lucan-fairweather", "threads", "orsolya-venn", "session-4"], "search": "hugh the party's friend, who made quite the scene in sanctuary city and has a patron in high places."}, {"id": "lucan-fairweather", "title": "Lucan Fairweather", "group": "People", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "A wine-stained council member who knows something about Hugh.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Lucen Fairweather", "Lucen"], "image": "", "html": "<p>A member of the <a class=\"wl\" href=\"#economic-council\">Economic Council</a> of <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>. He's podgy, with rings on his fingers and wine-stained lips, and attendants keep his cup filled. He tut-tutted when the party entered the council chamber and wouldn't look them in the eye the whole time.</p><h2>Session 4</h2><p>When <a class=\"wl\" href=\"#urzel-the-radiant\">Urzel</a> mentioned <a class=\"wl\" href=\"#hugh\">Hugh</a>, Lucan hiccupped at the name. <a class=\"wl\" href=\"#idra-voss\">Idra Voss</a> noticed too. Later she asked him straight out to tell them who this Hugh is, and against his better judgement he started to answer. <a class=\"wl\" href=\"#orsolya-venn\">Orsolya Venn</a> interrupted him before he could say much.</p>", "backlinks": ["overview", "timeline", "economic-council", "idra-voss", "hugh", "threads", "orsolya-venn", "session-4"], "search": "lucan fairweather lucen fairweather lucen a wine-stained council member who knows something about hugh."}, {"id": "orsolya-venn", "title": "Orsolya Venn", "group": "People", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Prelate of the Gilded Scale, whose shadow came loose in the council chamber.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Orsalia Venn", "Orsalia"], "image": "", "html": "<p>A member of the <a class=\"wl\" href=\"#economic-council\">Economic Council</a> of <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>, robed in yellow with religious inscriptions and emblems of office. She is the Prelate of <a class=\"wl\" href=\"#the-gilded-scale\">the Gilded Scale</a>, responsible for the religious side of the city's economy.</p><h2>Session 4</h2><p>When <a class=\"wl\" href=\"#idra-voss\">Idra Voss</a> said \"it's true\" and began her confession, everyone looked at her except Orsolya.</p><p>When <a class=\"wl\" href=\"#lucan-fairweather\">Lucan Fairweather</a> began to tell the party about <a class=\"wl\" href=\"#hugh\">Hugh</a>, Orsolya interrupted. Wind tore through the room and blew the scrolls off the table. She wavered in front of the heroes, and her shadow came away from her body and fragmented across the room as she began to chant a spell. The session ended there.</p><p>The night before, churches and holy sites across the city had been attacked by hooded figures.</p>", "backlinks": ["overview", "timeline", "economic-council", "hugh", "lucan-fairweather", "threads", "session-4", "the-gilded-scale"], "search": "orsolya venn orsalia venn orsalia prelate of the gilded scale, whose shadow came loose in the council chamber."}, {"id": "broadhurst", "title": "Broadhurst", "group": "Places", "type": "place", "typeLabel": "Place", "layout": "prose", "dek": "Where the party set out from.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "image": "", "html": "<p>The party departed Broadhurst for <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a> at the start of Session 1.</p>", "backlinks": ["overview", "timeline", "sanctuary-city", "session-1"], "search": "broadhurst where the party set out from."}, {"id": "grain
