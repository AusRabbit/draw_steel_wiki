<style>
  :root{
    --bg:#EDEFF2; --surface:#FFFFFF; --surface-2:#F5F7F9;
    --ink:#191D23; --muted:#59636F; --line:#D6DBE1;
    --amber:#9E2A2B; --amber-soft:#F2DCDC;
    --teal:#3F5873; --teal-soft:#DDE4EC;
    --rust:#9C3B2E; --rust-soft:#F2DFDB;
    --display:"Zilla Slab",Georgia,serif;
    --body:"Source Sans 3",system-ui,-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sp:clamp(16px,3vw,28px);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#13161A; --surface:#1B1F25; --surface-2:#22272E;
      --ink:#E4E8ED; --muted:#939DA9; --line:#2E353E;
      --amber:#E07A73; --amber-soft:#3A1E1E;
      --teal:#8FA8C4; --teal-soft:#1D2733;
      --rust:#D4776A; --rust-soft:#3A221E;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#13161A; --surface:#1B1F25; --surface-2:#22272E;
    --ink:#E4E8ED; --muted:#939DA9; --line:#2E353E;
    --amber:#E07A73; --amber-soft:#3A1E1E;
    --teal:#8FA8C4; --teal-soft:#1D2733;
    --rust:#D4776A; --rust-soft:#3A221E;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--body); font-size:16px; line-height:1.6;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  img{max-width:100%}
  a{color:inherit}
  h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0; font-weight:600}
  code{font-family:var(--mono); font-size:.92em; background:var(--surface-2); padding:1px 5px; border-radius:3px}

  .shell{display:grid; grid-template-columns:270px minmax(0,1fr)}
  @media (max-width:820px){ .shell{grid-template-columns:minmax(0,1fr)} }

  .rail{
    border-right:1px solid var(--line); background:var(--surface);
    padding:var(--sp) 0 48px; position:sticky; top:env(safe-area-inset-top,0px);
    align-self:start; max-height:100vh; overflow-y:auto;
  }
  @media (max-width:820px){
    .rail{position:static; max-height:none; border-right:0; border-bottom:1px solid var(--line); padding-bottom:20px}
  }
  .brand{padding:0 20px 18px; border-bottom:1px solid var(--line); margin-bottom:14px}
  .brand .ship{font-family:var(--display); font-size:21px; font-weight:700; line-height:1.15; letter-spacing:-.01em}
  .brand .sub{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:7px}

  .search{margin:0 20px 16px}
  .search input{
    width:100%; padding:8px 11px; border-radius:7px; font-family:var(--body); font-size:14px;
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
  }
  .search input:focus{outline:2px solid var(--amber); outline-offset:1px}

  .grp{margin-bottom:16px}
  .grp > .lbl{font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); padding:0 20px; margin-bottom:5px}
  .nav a{display:flex; align-items:baseline; gap:8px; justify-content:space-between; padding:5px 20px; text-decoration:none; font-size:14.5px; border-left:2px solid transparent}
  .nav a:hover{background:var(--surface-2)}
  .nav a[aria-current="page"]{border-left-color:var(--amber); background:var(--surface-2); font-weight:600}
  .nav a:focus-visible{outline:2px solid var(--amber); outline-offset:-2px}
  .nav a .n{font-family:var(--mono); font-size:10.5px; color:var(--muted)}

  main{padding:var(--sp); padding-block:calc(var(--sp) + 6px) 90px; max-width:820px}
  .crumb{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
  .ttl{font-size:clamp(28px,5vw,40px); line-height:1.08; letter-spacing:-.02em; margin-bottom:6px}
  .dek{color:var(--muted); font-size:17px; margin-bottom:22px}

  .badges{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px}
  .tag{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:4px; background:var(--surface-2); color:var(--muted); border:1px solid var(--line)}
  .tag.t-character{background:var(--teal-soft); color:var(--teal); border-color:transparent}
  .tag.t-place{background:var(--amber-soft); color:var(--amber); border-color:transparent}
  .tag.t-faction{background:var(--rust-soft); color:var(--rust); border-color:transparent}
  .tag.t-enemy{background:var(--rust-soft); color:var(--rust); border-color:transparent}
  .conf{display:inline-flex; align-items:center; gap:5px}
  .dot{width:7px; height:7px; border-radius:50%; display:inline-block}
  .dot.hi{background:var(--teal)} .dot.mid{background:var(--amber)} .dot.lo{background:var(--rust)}

  .prose p{margin:0 0 15px}
  .prose h2{font-size:15px; letter-spacing:.02em; margin:30px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line)}
  .prose ul{margin:0 0 16px; padding-left:20px}
  .prose li{margin-bottom:7px}
  .prose em{color:var(--muted)}

  a.wl{color:var(--teal); text-decoration:none; border-bottom:1px solid color-mix(in srgb, var(--teal) 35%, transparent); padding-bottom:.5px}
  a.wl:hover{border-bottom-color:var(--teal); background:var(--teal-soft)}
  a.wl.missing{color:var(--rust); border-bottom-style:dotted; border-bottom-color:var(--rust)}

  .panel{border:1px solid var(--line); border-radius:9px; background:var(--surface); padding:16px 18px; margin:0 0 18px}
  .panel .ph{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:9px}
  .panel p{margin:0}
  .panel.note{background:var(--surface-2)}
  .panel.warn{border-left:3px solid var(--rust)}

  .alias{display:inline-block; font-family:var(--mono); font-size:11.5px; padding:2px 7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); margin:0 4px 4px 0; color:var(--muted)}

  .backlinks{margin-top:34px; padding-top:16px; border-top:1px solid var(--line)}
  .backlinks .ph{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
  .backlinks ul{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px}
  .backlinks li a{font-size:13.5px; text-decoration:none; padding:3px 9px; border-radius:5px; background:var(--surface-2); border:1px solid var(--line)}
  .backlinks li a:hover{border-color:var(--teal); color:var(--teal)}

  .thread{border-left:2px solid var(--line); padding:0 0 2px 15px; margin-bottom:20px}
  .thread.open{border-left-color:var(--amber)}
  .thread.hot{border-left-color:var(--rust)}
  .thread h3{font-size:16.5px; margin-bottom:3px}
  .thread .st{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:5px}
  .thread p{margin:0; font-size:15px}

  .beat{display:grid; grid-template-columns:70px minmax(0,1fr); gap:14px; margin-bottom:16px}
  .timeline-session{font-size:20px!important; margin:32px 0 16px!important; padding-bottom:7px!important; border-bottom:1px solid var(--line)!important}
  .timeline-session:first-child{margin-top:4px!important}
  @media (max-width:520px){ .beat{grid-template-columns:minmax(0,1fr); gap:2px} }
  .beat .t{font-family:var(--mono); font-size:11.5px; color:var(--muted); padding-top:4px}
  .beat .b p{margin:2px 0 0; font-size:14.5px; color:var(--muted)}

  .portrait{margin:0 0 22px; width:min(300px,100%); aspect-ratio:1; border-radius:10px; overflow:hidden; background:radial-gradient(circle at 50% 40%, var(--surface-2), var(--line)); border:1px solid var(--line)}
  .portrait img{display:block; width:100%; height:100%; object-fit:contain}
  .foot{margin-top:44px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; color:var(--muted)}

  .themebtn{
    position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px));
    border:1px solid var(--line); background:var(--surface); color:var(--muted);
    font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    padding:7px 11px; border-radius:6px; cursor:pointer;
  }
  .themebtn:hover{color:var(--ink); border-color:var(--amber)}
  @media (prefers-reduced-motion:no-preference){ .nav a,a.wl,.backlinks li a{transition:background .12s,color .12s,border-color .12s} }
</style>
</head>

<script>
const PAGES  = [{"id": "overview", "title": "Campaign Overview", "group": "Campaign", "type": "doc", "typeLabel": "Session", "layout": "prose", "dek": "Where the party stands at the end of Session 3.", "conf": "", "confLabel": "", "player": "", "aliases": [], "image": "", "html": "<p>The heroes set out from <a class=\"wl\" href=\"#broadhurst\">Broadhurst</a> for <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>. Getting in did not go cleanly: the party was split at the gates, and <a class=\"wl\" href=\"#urzel-the-radiant\">Urzel</a> was only brought inside after the others murdered members of the <a class=\"wl\" href=\"#ashgate-watch\">Ashgate Watch</a>.</p><h2>Current Position</h2><p>The party escaped the Watch, found <a class=\"wl\" href=\"#annabel-swordbuck\">Annabel Swordbuck</a>'s smuggler's hide, and lost it again when the guard broke in. <a class=\"wl\" href=\"#bertrude\">Bertrude</a> and <a class=\"wl\" href=\"#torr\">Torr</a> stayed behind to hold the door. <a class=\"wl\" href=\"#aurelion\">Aurelion</a>, <a class=\"wl\" href=\"#malthazar\">Malthazar</a> and <a class=\"wl\" href=\"#urzel-the-radiant\">Urzel</a> escaped into the sewers and agreed to get Annabel's crew through them.</p><p>Beneath the city they found <a class=\"wl\" href=\"#the-cistern\">a cistern</a> overrun by <a class=\"wl\" href=\"#demons\">Demons</a>, with bodies being sent over the edge into an abyss. A voice from the dark ordered the demons to \"finish these fools\". The heroes won, and among the bodies they found <a class=\"wl\" href=\"#the-mawblade\">the Mawblade</a>.</p><p>Sanctuary City is under assault by demons. Session 3 ended with the party still in the sewers, about to head back to civilisation.</p><h2>The Heroes</h2><ul><li><a class=\"wl\" href=\"#aurelion\">Aurelion</a> — human censor, a former watch officer.</li><li><a class=\"wl\" href=\"#bertrude\">Bertrude</a> — human telepath, a disavowed agent.</li><li><a class=\"wl\" href=\"#malthazar\">Malthazar</a> — dragon knight shadow with a criminal past.</li><li><a class=\"wl\" href=\"#torr\">Torr</a> — high elf tactician raised among the Wode Elves.</li><li><a class=\"wl\" href=\"#urzel-the-radiant\">Urzel the Radiant</a> — orc conduit of Life and Sun.</li></ul><p>Session-by-session detail is in the recaps, the cumulative <a class=\"wl\" href=\"#timeline\">Campaign Timeline</a> and the <a class=\"wl\" href=\"#threads\">Open Threads</a> page.</p>", "backlinks": [], "search": "campaign overview where the party stands at the end of session 3."}, {"id": "timeline", "title": "Campaign Timeline", "group": "Campaign", "type": "doc", "typeLabel": "Session", "layout": "timeline", "dek": "Session beats in order.", "conf": "", "confLabel": "", "player": "", "aliases": [], "image": "", "html": "<h2 class=\"timeline-session\">Session 1</h2><div class=\"beat\"><div class=\"t\">1</div><div class=\"b\"><strong>Departure</strong><p>The party leaves <a class=\"wl\" href=\"#broadhurst\">Broadhurst</a> for <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>.</p></div></div><div class=\"beat\"><div class=\"t\">2</div><div class=\"b\"><strong>Refugees</strong><p>Hopeful refugees on the road to Sanctuary City.</p></div></div><div class=\"beat\"><div class=\"t\">3</div><div class=\"b\"><strong>The gates</strong><p>The party is interrogated at the gates and split up.</p></div></div><div class=\"beat\"><div class=\"t\">4</div><div class=\"b\"><strong>Something is off</strong><p>Inside Sanctuary City, something is not right.</p></div></div><div class=\"beat\"><div class=\"t\">5</div><div class=\"b\"><strong>The side gate</strong><p>A scene at a side gate into the city.</p></div></div><div class=\"beat\"><div class=\"t\">6</div><div class=\"b\"><strong>Getting Urzel in</strong><p><a class=\"wl\" href=\"#the-tail-and-claw\">The Tail and Claw</a>, criminal elements, stolen uniforms, and members of the <a class=\"wl\" href=\"#ashgate-watch\">Ashgate Watch</a> murdered to sneak <a class=\"wl\" href=\"#urzel-the-radiant\">Urzel</a> in.</p></div></div><h2 class=\"timeline-session\">Session 2</h2><div class=\"beat\"><div class=\"t\">1</div><div class=\"b\"><strong>Alarm bells</strong><p>The Watch is alerted and the party flees into the back alleys.</p></div></div><div class=\"beat\"><div class=\"t\">2</div><div class=\"b\"><strong>The chase</strong><p>The party escapes the Ashgate Watch.</p></div></div><div class=\"beat\"><div class=\"t\">3</div><div class=\"b\"><strong>The bolt hole</strong><p><a class=\"wl\" href=\"#annabel-swordbuck\">Annabel Swordbuck</a> is found in a smuggler's bolt hole.</p></div></div><h2 class=\"timeline-session\">Session 3</h2><div class=\"beat\"><div class=\"t\">00:09</div><div class=\"b\"><strong>Malthazar's detour</strong><p><a class=\"wl\" href=\"#malthazar\">Malthazar</a> beat up three thieves robbing a rich girl, then robbed her himself.</p></div></div><div class=\"beat\"><div class=\"t\">00:10</div><div class=\"b\"><strong>Wings in the night</strong><p><a class=\"wl\" href=\"#ashgate-watch\">Ashgate</a> guards are telling stories about winged individuals.</p></div></div><div class=\"beat\"><div class=\"t\">00:10</div><div class=\"b\"><strong>Coins through the peephole</strong><p>Malthazar buys his way into <a class=\"wl\" href=\"#annabel-swordbuck\">Annabel</a>'s hide.</p></div></div><div class=\"beat\"><div class=\"t\">00:12</div><div class=\"b\"><strong>\"Open up, it's the guard!\"</strong><p>Annabel's crew vanishes. <a class=\"wl\" href=\"#torr\">Torr</a> tries to talk the guard away.</p></div></div><div class=\"beat\"><div class=\"t\">00:17</div><div class=\"b\"><strong>The false door</strong><p>Malthazar finds a hidden door behind the crates. <a class=\"wl\" href=\"#bertrude\">Bertrude</a> and Torr hold the door.</p></div></div><div class=\"beat\"><div class=\"t\">00:19</div><div class=\"b\"><strong>Into the sewers</strong><p><a class=\"wl\" href=\"#urzel-the-radiant\">Urzel</a> lights the way. Annabel blames the party for her lost goods.</p></div></div><div class=\"beat\"><div class=\"t\">00:21</div><div class=\"b\"><strong>Annabel's bargain</strong><p>Groups sent into the sewers don't come back; get her crew through.</p></div></div><div class=\"beat\"><div class=\"t\">00:27</div><div class=\"b\"><strong>Through the sewage</strong><p>Malthazar scouts ahead.</p></div></div><div class=\"beat\"><div class=\"t\">00:32</div><div class=\"b\"><strong>Demons</strong><p><a class=\"wl\" href=\"#the-cistern\">The Cistern</a> is full of <a class=\"wl\" href=\"#pitling\">pitlings</a>, <a class=\"wl\" href=\"#ruinant\">ruinants</a>, <a class=\"wl\" href=\"#frenzied\">Frenzied</a>, <a class=\"wl\" href=\"#torlas\">torlases</a> and a <a class=\"wl\" href=\"#bendrak\">Bendrak</a>.</p></div></div><div class=\"beat\"><div class=\"t\">01:17</div><div class=\"b\"><strong>A frenzied splits</strong><p>It cracks open from within and becomes a new ruinant.</p></div></div><div class=\"beat\"><div class=\"t\">01:25</div><div class=\"b\"><strong>Ping pong</strong><p>The torlases drag <a class=\"wl\" href=\"#aurelion\">Aurelion</a> back and forth through a floor of flesh.</p></div></div><div class=\"beat\"><div class=\"t\">01:38</div><div class=\"b\"><strong>\"Finish these fools\"</strong><p>A voice from the centre of the cistern. <a class=\"wl\" href=\"#fiktin\">Fiktins</a> rise from the water.</p></div></div><div class=\"beat\"><div class=\"t\">01:41</div><div class=\"b\"><strong>The bendrak dies</strong><p>Killed in one last attempt to bend Aurelion's mind.</p></div></div><div class=\"beat\"><div class=\"t\">01:48</div><div class=\"b\"><strong>The edge</strong><p>A woman's body drifts into a sinkhole like a pit to another world.</p></div></div><div class=\"beat\"><div class=\"t\">01:49</div><div class=\"b\"><strong>Draining the cistern</strong><p>Urzel works the sluice controls. A rock turns out to be a fiktin.</p></div></div><div class=\"beat\"><div class=\"t\">01:52</div><div class=\"b\"><strong>The bodies</strong><p>A mound of corpses being readied for the edge. Another fiktin bursts from the rags.</p></div></div><div class=\"beat\"><div class=\"t\">02:00</div><div class=\"b\"><strong>The fiktins fall</strong><p>They fight to the death.</p></div></div><div class=\"beat\"><div class=\"t\">02:01</div><div class=\"b\"><strong>The Mawblade</strong><p>A black iron blade lined with ivory teeth, set apart from the bodies.</p></div></div><div class=\"beat\"><div class=\"t\">02:02</div><div class=\"b\"><strong>The truth</strong><p>Sanctuary City is under assault by demons.</p></div></div>", "backlinks": ["overview"], "search": "campaign timeline session beats in order."}, {"id": "threads", "title": "Open Threads", "group": "Campaign", "type": "doc", "typeLabel": "Session", "layout": "threads", "dek": "What the party is carrying unresolved after Session 3.", "conf": "", "confLabel": "", "player": "", "aliases": [], "image": "", "html": "<div class=\"thread hot\"><div class=\"st\">New</div><h3>Who commands the demons?</h3><p>A voice from the centre of <a class=\"wl\" href=\"#the-cistern\">the Cistern</a> ordered the <a class=\"wl\" href=\"#demons\">Demons</a> to \"finish these fools\", and the <a class=\"wl\" href=\"#fiktin\">fiktins</a> fought to the death as though ordered to. At the table the heroes suspected someone is controlling them.</p></div><div class=\"thread hot\"><div class=\"st\">Unexplained</div><h3>The bodies and the abyss</h3><p>In the Cistern, an enormous mound of corpses was being prepared to go over the edge into a sinkhole that looks like a pit into another world. Strange bodies are also being pulled out of the city's canals.</p></div><div class=\"thread hot\"><div class=\"st\">Separated</div><h3>Bertrude and Torr</h3><p><a class=\"wl\" href=\"#bertrude\">Bertrude</a> and <a class=\"wl\" href=\"#torr\">Torr</a> stayed behind to hold the door of <a class=\"wl\" href=\"#annabel-swordbuck\">Annabel</a>'s hide against the guard so the others could escape. Nobody knows what happened to them.</p></div><div class=\"thread open\"><div class=\"st\">More to learn</div><h3>The Mawblade</h3><p>The party found <a class=\"wl\" href=\"#the-mawblade\">the Mawblade</a> among the bodies, wrapped in rags and set apart. The Director has promised to tell them more about it.</p></div><div class=\"thread open\"><div class=\"st\">Unpaid</div><h3>Annabel's bargain</h3><p>Annabel blames the party for the loss of her hide. Her price was for them to get her crew through the sewers, and maybe then they could talk. She and her crew were waiting back in the tunnels while the party fought in the Cistern.</p></div><div class=\"thread hot\"><div class=\"st\">Hunting the party</div><h3>The Ashgate Watch</h3><p>The party murdered members of the <a class=\"wl\" href=\"#ashgate-watch\">Ashgate Watch</a> to get <a class=\"wl\" href=\"#urzel-the-radiant\">Urzel</a> into the city. Guards are now telling stories about winged individuals, and the guard has raided Annabel's hide.</p></div><div class=\"thread open\"><div class=\"st\">Loose</div><h3>Demons that got away</h3><p>Some <a class=\"wl\" href=\"#pitling\">pitlings</a> and a <a class=\"wl\" href=\"#ruinant\">Ruinant</a> scampered off into the dark tunnels during the fight in the Cistern.</p></div><div class=\"thread closed\"><div class=\"st\">Answered in Session 3</div><h3>Something is off in Sanctuary City</h3><p>Sanctuary City is under assault by <a class=\"wl\" href=\"#demons\">Demons</a>. That is why no one goes into the sewers and why everything in the city has gone astray.</p></div>", "backlinks": ["overview"], "search": "open threads what the party is carrying unresolved after session 3."}, {"id": "session-1", "title": "Session 1 — The Road to Sanctuary", "group": "Sessions", "type": "doc", "typeLabel": "Session", "layout": "prose", "dek": "Session recap — safe to share with the table.", "conf": "", "confLabel": "", "player": "", "aliases": [], "image": "", "html": "<h2>Leaving Broadhurst</h2><p>The party set out from <a class=\"wl\" href=\"#broadhurst\">Broadhurst</a>, bound for <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>.</p><h2>Refugees on the Road</h2><p>On the road they fell in with refugees heading the same way, hopeful of what they would find in Sanctuary City.</p><h2>The Gates</h2><p>At the city gates the party was interrogated and split up.</p><h2>Something Is Off</h2><p>Inside, something about <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a> did not sit right.</p><h2>The Side Gate</h2><p>The party played out a scene at a side gate into the city.</p><h2>Getting Urzel In</h2><p>The party found <a class=\"wl\" href=\"#the-tail-and-claw\">the Tail and Claw</a> and interacted with the city's criminal elements. They stole some uniforms, and they murdered members of the <a class=\"wl\" href=\"#ashgate-watch\">Ashgate Watch</a> in order to sneak <a class=\"wl\" href=\"#urzel-the-radiant\">Urzel</a> into the city.</p>", "backlinks": [], "search": "session 1 — the road to sanctuary session recap — safe to share with the table."}, {"id": "session-2", "title": "Session 2 — Into the Alleys", "group": "Sessions", "type": "doc", "typeLabel": "Session", "layout": "prose", "dek": "Session recap — safe to share with the table.", "conf": "", "confLabel": "", "player": "", "aliases": [], "image": "", "html": "<h2>Alarm Bells</h2><p>The killings did not go unnoticed. Alarm bells rang, the rest of the <a class=\"wl\" href=\"#ashgate-watch\">Ashgate Watch</a> was alerted, and the party fled into the back alleys of <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>.</p><h2>Through the Back Alleys</h2><p>A chase through the alleys followed, and the party escaped the Watch.</p><h2>The Bolt Hole</h2><p>The party found <a class=\"wl\" href=\"#annabel-swordbuck\">Annabel Swordbuck</a> in a smuggler's bolt hole.</p><h2>As Recalled at the Table</h2><p>At the start of <a class=\"wl\" href=\"#session-3\">Session 3</a> the players remembered a few more details. <a class=\"wl\" href=\"#malthazar\">Malthazar</a> was lost along the way during the chase. The others met <a class=\"wl\" href=\"#bertrude\">Bertrude</a>, got past a few checkpoints, and went down a storm drain into the canals, where they ran into the criminals at the hide.</p>", "backlinks": [], "search": "session 2 — into the alleys session recap — safe to share with the table."}, {"id": "session-3", "title": "Session 3 — The Cistern", "group": "Sessions", "type": "doc", "typeLabel": "Session", "layout": "prose", "dek": "Session recap — safe to share with the table.", "conf": "", "confLabel": "", "player": "", "aliases": [], "image": "", "html": "<h2>Where Malthazar Went</h2><p><a class=\"wl\" href=\"#malthazar\">Malthazar</a> had vanished during the chase through the back alleys. As he tells it, he caught sight of three thieves robbing a lone girl who looked like a rich man's daughter. He decided that couldn't happen on his watch, beat up all three, and then stole her money himself. By then he had lost the others.</p><p>He turned up at the door of <a class=\"wl\" href=\"#annabel-swordbuck\">Annabel</a>'s hide shoving coins through the peephole, and her crew let him in. Money buys everything in a place like that.</p><p>The <a class=\"wl\" href=\"#ashgate-watch\">Ashgate Watch</a> had been talking too. Guards were claiming they'd seen individuals with wings, and it had frightened them.</p><h2>The Hide Is Raided</h2><p>Annabel introduced the party to her crew: three or four people, all nicknames and sideways glances, with a squat, gruff dwarf at her side who cared more about her safety than about anything in the street.</p><p>Then came a pounding at the only door: \"Open up, it's the guard!\" When the party looked round, Annabel and her crew had vanished. <a class=\"wl\" href=\"#torr\">Torr</a> tried to talk the guard away through the door (\"we're all very tired in here\") and got nowhere. <a class=\"wl\" href=\"#aurelion\">Aurelion</a> searched for where Annabel had gone and found nothing. Something heavier than a boot started breaking the door in.</p><p>Malthazar, who knows a thing or two about how smugglers build these places, found a false door hidden behind crates and worked out the mechanism just in time. The party slipped out, leaving behind a hide full of jewels, gems, weapons, drugs and booze. As the door fell in, <a class=\"wl\" href=\"#bertrude\">Bertrude</a> and Torr shouted for the others to go on ahead while they held the door.</p><h2>Annabel's Bargain</h2><p>The tunnel led into the <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a> sewers. <a class=\"wl\" href=\"#urzel-the-radiant\">Urzel</a>, whose god is a god of fire and light, conjured a floating ball of light to see by.</p><p>They soon caught up with Annabel and her gang. She was not pleased. It was because of the party that the guard had found her hide, and months of smuggling work were gone. Then, with a glance behind her into the dark, she told them that things are amiss in Sanctuary City. The hide was so full because her people no longer trust the sewers: every group they send down doesn't come back. Her price was to have the party get her crew through the sewers, and maybe then they could talk.</p><h2>The Cistern</h2><p>Hours of winding tunnels followed, with strange noises growing more frequent, until the party heard rushing water ahead. Annabel's crew hung back. Malthazar scouted ahead by sliding into the putrid sewage.</p><p>What he found was <a class=\"wl\" href=\"#the-cistern\">a cistern</a> full of <a class=\"wl\" href=\"#demons\">Demons</a>. None of the heroes had ever faced a demon before:</p><ul><li><a class=\"wl\" href=\"#pitling\">Pitlings</a> — stinking little things with many tongues and bodies split open, spitting acid.</li><li><a class=\"wl\" href=\"#ruinant\">Ruinants</a> — the captains, each leading a pack.</li><li><a class=\"wl\" href=\"#frenzied\">Frenzied</a> — fast, with huge claws and many teeth.</li><li><a class=\"wl\" href=\"#torlas\">Torlases</a> — they turned the floor to spongy flesh and dragged Aurelion back and forth through it like a game of ping pong.</li><li>A <a class=\"wl\" href=\"#bendrak\">Bendrak</a> — like a horse with a strange head and gems floating around its body, which warped the heroes' perceptions and turned their blows against each other.</li></ul><p>The fight was long and brutal. The demons proved weak to holy power. Twice a frenzied split and cracked open from within to become a new ruinant. Malthazar hid up in the piping and planted a sticky bomb on the bendrak, which eventually died in one last attempt to bend Aurelion's mind.</p><h2>\"Finish These Fools\"</h2><p>A rumbling came from the centre of the cistern, then a voice, clear as day: \"Finish these fools.\" Shapes rose from the water and hid among the pillars: <a class=\"wl\" href=\"#fiktin\">fiktins</a>, humanoid figures made of dripping, oily blood, the strongest creatures the party had faced. The remaining pitlings and a ruinant scampered off into the dark tunnels.</p><p>The party split up to explore while the fiktins hunted them:</p><ul><li><strong>The edge.</strong> From the catwalk, Aurelion saw the water pour into a sinkhole that looked less like a sewer than a pit into another world. A woman's body, wrapped in rags, drifted over the edge and dwindled to a pinprick.</li><li><strong>The bodies.</strong> On a ledge lay an enormous mound of corpses, apparently being prepared to go over the edge. A fiktin burst from the rags of one of them.</li><li><strong>The controls.</strong> Urzel found sluice controls and drained the cistern. A rock that had been sliding around underwater turned out to be another fiktin.</li></ul><p>The fiktins fought to the death, as though their lives had been ordered forfeit, and fell.</p><h2>The Mawblade</h2><p>Among the bodies, wrapped in rags and kept apart from everything else bound for the edge, the party found a blade of black iron whose edge is lined with ivory teeth: <a class=\"wl\" href=\"#the-mawblade\">the Mawblade</a>. There is more to learn about it.</p><h2>What It Means</h2><p>Sanctuary City is under assault by demons. That is why no one goes into the sewers, why strange bodies are being pulled out of the canals, and why everything in the city has gone astray. At the table the heroes suspected that someone is controlling the demons.</p>", "backlinks": ["ashgate-watch", "bendrak", "demons", "fiktin", "frenzied", "pitling", "ruinant", "sanctuary-city", "session-2", "the-cistern", "the-mawblade", "torlas"], "search": "session 3 — the cistern session recap — safe to share with the table."}, {"id": "aurelion", "title": "Aurelion", "group": "Heroes", "type": "hero", "typeLabel": "Hero", "layout": "prose", "dek": "Human censor of the Paragon order, once a watch officer. Level 2.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Aurelian", "Aurelien", "Arulian", "Rulian", "Rullian"], "image": "", "html": "<h2>At a Glance</h2><ul><li><strong>Ancestry:</strong> Human</li><li><strong>Class:</strong> Censor — Paragon order, Fate domain</li><li><strong>Career:</strong> Watch Officer</li><li><strong>Culture:</strong> Human — urban, communal, labor upbringing</li><li><strong>Level:</strong> 2 · Wealth 1 · Renown 0</li></ul><h2>Characteristics</h2><ul><li><strong>Might</strong> 2 · <strong>Agility</strong> −1 · <strong>Reason</strong> 1 · <strong>Intuition</strong> 1 · <strong>Presence</strong> 2</li><li><strong>Stamina</strong> 39 (winded at 19) · <strong>Recoveries</strong> 14, recovering 13 Stamina each</li><li><strong>Speed</strong> 5 · <strong>Size</strong> 1M · <strong>Stability</strong> 2 · <strong>Disengage</strong> 1</li><li><strong>Heroic resource:</strong> Wrath</li><li><strong>Kit:</strong> Mountain — heavy weapon, heavy armor (+4 melee damage at tier 3)</li></ul><h2>Inciting Incident — Powerful Enemies</h2><p>Aurelion made it their responsibility to root out and bring down the region's foremost crime syndicate. The syndicate sent goons to burn down their home and teach them a lesson, leaving them bleeding in the street with nothing left but their life. They have since taken on the life of a hero to gain the power and influence needed to destroy the syndicate once and for all.</p><h2>Languages</h2><p>Caelian, Szetch, Vaslorian, Zaliac.</p><h2>Skills</h2><p>Climb, Endurance, Jump, Lift, Lead, Intimidate, Read Person, Search, Religion.</p><h2>Traits and Perks</h2><ul><li><strong>Detect the Supernatural</strong> and <strong>Resist the Unnatural</strong> — human ancestry traits; <strong>Staying Power</strong> grants +2 Recoveries.</li><li><strong>Team Leader</strong> — spend a hero token at the start of a group or montage test so every participant tests as if they had the hero's exploration skills.</li><li><strong>Engrossing Monologue</strong> — outside combat, shout to hold the attention of non-hostile creatures within 10 squares; allies gain an edge to avoid being noticed while they listen.</li></ul><h2>Class Features</h2><ul><li><strong>Judgment</strong> — a prayer that outlines a foe in holy energy and punishes it for acting.</li><li><strong>My Life for Yours</strong> — spend a Recovery to let yourself or an ally regain Stamina.</li><li><strong>Lead by Example</strong> and <strong>Stalwart Example</strong> — the gods' favour helps allies flank and aids tests to intimidate or persuade.</li></ul><h2>Abilities</h2><ul><li><strong>Pain for Pain</strong> (signature) — \"An enemy who tagged you will pay for that.\"</li><li><strong>Your Allies Cannot Save You!</strong> (signature) — a holy strike that shoves the target's adjacent allies away.</li><li><strong>The Gods Punish and Defend</strong> (3 Wrath) — smite a foe and heal an ally.</li><li><strong>Arrest</strong> (5 Wrath) — \"I got you, you son of a bitch.\"</li><li><strong>Blessing of the Faithful</strong> (5 Wrath) — an aura granting surges to allies.</li></ul>", "backlinks": ["bendrak", "overview", "timeline", "session-3", "torlas"], "search": "aurelion aurelian aurelien arulian rulian rullian human censor of the paragon order, once a watch officer. level 2."}, {"id": "bertrude", "title": "Bertrude", "group": "Heroes", "type": "hero", "typeLabel": "Hero", "layout": "prose", "dek": "Human telepath and disavowed agent. Level 2.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Birdie", "Bertred"], "image": "", "html": "<div class=\"panel note\"><div class=\"ph\">Name on the sheet</div><p>The character name field on the Forge Steel sheet is blank. The Director calls her Bertrude at the table, and she likes to be called Bertie.</p></div><h2>At a Glance</h2><ul><li><strong>Ancestry:</strong> Human</li><li><strong>Class:</strong> Talent — Telepathy tradition</li><li><strong>Career:</strong> Agent</li><li><strong>Culture:</strong> Bespoke — secluded, bureaucratic, academic upbringing</li><li><strong>Level:</strong> 2 · Wealth 1 · Renown 0</li></ul><h2>Characteristics</h2><ul><li><strong>Might</strong> −1 · <strong>Agility</strong> 1 · <strong>Reason</strong> 2 · <strong>Intuition</strong> 1 · <strong>Presence</strong> 2</li><li><strong>Stamina</strong> 24 (winded at 12) · <strong>Recoveries</strong> 10, recovering 8 Stamina each</li><li><strong>Speed</strong> 5 · <strong>Size</strong> 1M · <strong>Stability</strong> 0 · <strong>Disengage</strong> 1</li><li><strong>Heroic resource:</strong> Clarity</li><li><strong>Augmentation:</strong> Distance Augmentation (+2 distance to ranged psionic abilities)</li><li><strong>Ward:</strong> Repulsive Ward</li></ul><h2>Inciting Incident — Disavowed</h2><p>On a dangerous espionage assignment, things went sideways. Bertrude escaped with their life, but the mission was a public failure thanks to bad information their agency gave them. The agency denied they worked for it, and Bertrude went on the run. Hero work will let them survive and clear their name.</p><h2>Languages</h2><p>Caelian, Hyrallic, Mindspeech, Vaslorian, Yllyric.</p><h2>Skills</h2><p>Empathize, Flirt, Lie, Persuade, Disguise, Search, Sneak, Magic, Psionics, Timescape.</p><h2>Traits and Perks</h2><ul><li><strong>Detect the Supernatural</strong> and <strong>Resist the Unnatural</strong> — human ancestry traits; <strong>Staying Power</strong> grants +2 Recoveries.</li><li><strong>Forgettable Face</strong> — after ten minutes or less with someone new, they can be made to forget your face; disguises come easily.</li></ul><h2>Class Features</h2><ul><li><strong>Telepathic Speech</strong> — speak mind to mind with any creature within Mind Spike's range that shares a language.</li><li><strong>Ease the Mind</strong> — an edge on tests to stop combat and start a negotiation, and hostile or suspicious NPCs have more patience.</li><li><strong>Mind Spike</strong> — a telepathic bolt that instantly zaps a creature's brain.</li><li><strong>Remote Assistance</strong> — an ally gains the benefit of your intellect.</li><li><strong>Feedback Loop</strong> — a brief psychic link gives an enemy a taste of its own medicine.</li></ul><h2>Abilities</h2><ul><li><strong>Kinetic Grip</strong> (signature) — lift and hurl a foe away.</li><li><strong>Kinetic Pulse</strong> (signature) — the force of your mind hurls enemies backward.</li><li><strong>Awe</strong> (3 Clarity) — project psionic energy and take on a new visage in a creature's mind.</li><li><strong>Flashback</strong> (5 Clarity) — throw a target several seconds back through time so it can act again.</li></ul>", "backlinks": ["overview", "timeline", "threads", "session-2", "session-3"], "search": "bertrude birdie bertred human telepath and disavowed agent. level 2."}, {"id": "malthazar", "title": "Malthazar", "group": "Heroes", "type": "hero", "typeLabel": "Hero", "layout": "prose", "dek": "Dragon knight shadow of the College of Caustic Alchemy, with a criminal past. Level 2.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Malthasar", "Malfazel", "Mothazel", "Balthazar", "Mouth Desire"], "image": "", "html": "<h2>At a Glance</h2><ul><li><strong>Ancestry:</strong> Dragon Knight</li><li><strong>Class:</strong> Shadow — College of Caustic Alchemy</li><li><strong>Career:</strong> Criminal</li><li><strong>Culture:</strong> Bespoke — nomadic, communal, lawless upbringing</li><li><strong>Level:</strong> 2 · Wealth 1 · Renown 1</li></ul><h2>Characteristics</h2><ul><li><strong>Might</strong> −1 · <strong>Agility</strong> 2 · <strong>Reason</strong> 2 · <strong>Intuition</strong> 2 · <strong>Presence</strong> −1</li><li><strong>Stamina</strong> 24 (winded at 12) · <strong>Recoveries</strong> 8, recovering 8 Stamina each</li><li><strong>Speed</strong> 5 (fly) · <strong>Size</strong> 1M · <strong>Stability</strong> 0 · <strong>Disengage</strong> 1</li><li><strong>Heroic resource:</strong> Insight</li><li><strong>Immunity:</strong> Fire 2</li><li><strong>Kit:</strong> none recorded on the sheet</li></ul><h2>Inciting Incident — Atonement</h2><p>The last criminal job Malthazar pulled led to the death of someone, or the destruction of something, they loved. To make up for the loss, they left their criminal ways behind and became a hero.</p><h2>Languages</h2><p>Caelian, Vastariax, and I Speak Their Language (Criminal).</p><h2>Skills</h2><p>Alchemy, Forgery, Mechanics, Gymnastics, Navigate, Lie, Intimidate, Read Person, Disguise, Eavesdrop, Sabotage, Sneak, Track, Criminal Underworld.</p><h2>Traits and Perks</h2><ul><li><strong>Wings</strong> — fly for a number of rounds equal to Might (minimum 1). While flying at levels 1–3, Malthazar has damage weakness 5.</li><li><strong>Draconian Guard</strong> — swing the wings round to guard against a blow.</li><li><strong>Lucky Dog</strong> — after failing an intrigue test, lose Stamina to improve the outcome by one tier.</li><li><strong>Criminal Contacts</strong> — during a respite in a settlement, ask the local criminal network a question.</li></ul><h2>Class Features</h2><ul><li><strong>Trained Assassin</strong> — an extra surge on strikes that use surges.</li><li><strong>Smoke Bomb</strong> — hide even when observed, then shift away.</li><li><strong>Coat the Blade</strong> — \"A little poison goes a long way.\"</li><li><strong>Hesitation Is Weakness</strong> — take a turn straight after another hero.</li><li><strong>Defensive Roll</strong> — roll with an enemy's attack to reduce the harm.</li><li><strong>Sticky Bomb</strong> — explosives are best when they're attached to an enemy.</li></ul><h2>Abilities</h2><ul><li><strong>Teamwork Has Its Place</strong> (signature) — attack an enemy as an ally exposes its weakness.</li><li><strong>Get In Get Out</strong> (3 Insight) — move unexpectedly, strike fast and be gone.</li><li><strong>One Hundred Throats</strong> (5 Insight) — move across the battlefield and strike every foe within reach.</li></ul>", "backlinks": ["overview", "timeline", "session-2", "session-3"], "search": "malthazar malthasar malfazel mothazel balthazar mouth desire dragon knight shadow of the college of caustic alchemy, with a criminal past. level 2."}, {"id": "torr", "title": "Torr", "group": "Heroes", "type": "hero", "typeLabel": "Hero", "layout": "prose", "dek": "High elf tactician of the Mastermind doctrine, raised among the Wode Elves. Level 2.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Tor"], "image": "", "html": "<h2>At a Glance</h2><ul><li><strong>Ancestry:</strong> High Elf</li><li><strong>Class:</strong> Tactician — Mastermind doctrine</li><li><strong>Career:</strong> Laborer</li><li><strong>Culture:</strong> Wode Elf — wilderness, bureaucratic, martial upbringing</li><li><strong>Level:</strong> 2 · Wealth 1 · Renown 0</li></ul><h2>Characteristics</h2><ul><li><strong>Might</strong> 2 · <strong>Agility</strong> −1 · <strong>Reason</strong> 2 · <strong>Intuition</strong> 1 · <strong>Presence</strong> 1</li><li><strong>Stamina</strong> 42 (winded at 21) · <strong>Recoveries</strong> 10, recovering 14 Stamina each</li><li><strong>Speed</strong> 6 · <strong>Size</strong> 1M · <strong>Stability</strong> 1 · <strong>Disengage</strong> 2</li><li><strong>Heroic resource:</strong> Focus</li><li><strong>Kits:</strong> Shining Armor and Sniper (Field Arsenal) — medium weapon, bow, heavy armor</li><li><strong>Immunity:</strong> Dazed (Unstoppable Mind)</li></ul><h2>Inciting Incident — Disaster</h2><p>A disaster hit Torr's crew while they were working. Torr saved as many as they could, but the ones they couldn't save weigh heavily on their mind. They took up the life of a hero to save as many people as possible, vowing that what happened would not happen again.</p><h2>Languages</h2><p>Caelian, Ullorvic, Yllyric.</p><h2>Skills</h2><p>Cooking, Drive, Endurance, Gymnastics, Navigate, Lead, Persuade, Alertness, Criminal Underworld, Strategy.</p><h2>Traits and Perks</h2><ul><li><strong>High Senses</strong> — an edge on tests to notice threats.</li><li><strong>High Elf Glamor</strong> — an edge on Presence tests using Flirt or Persuade; Torr appears slightly different to each observer, but always as themselves.</li><li><strong>Unstoppable Mind</strong> — immune to dazed.</li><li><strong>Teamwork</strong> — on the first turn of a montage test, make a test and assist another hero's.</li><li><strong>Danger Sense</strong> — in natural environments, an edge on Alertness, can't be surprised, and a warning of imminent natural disaster.</li></ul><h2>Class Features</h2><ul><li><strong>Studied Commander</strong> — knowledge of battle makes war lore projects cheaper and can reveal what an encounter or negotiation holds.</li><li><strong>Mark</strong> — draw allies' attention to a specific foe.</li><li><strong>\"Strike Now!\"</strong> — point out an opening to an ally.</li><li><strong>Overwatch</strong> — an ally waits for the right moment to strike.</li><li><strong>Goaded</strong> — goad marked foes into acting before they're ready.</li></ul><h2>Abilities</h2><ul><li><strong>Patient Shot</strong> (signature) — \"Breathe ... aim ... wait ... then strike!\"</li><li><strong>Protective Attack</strong> (signature) — a strike that makes it impossible for the foe to ignore you.</li><li><strong>Concussive Strike</strong> (3 Focus) — a precise strike that leaves the foe struggling to respond.</li><li><strong>I've Got Your Back</strong> (5 Focus) — the enemy will think twice about attacking your friend.</li><li><strong>This Is What We Planned For</strong> (5 Focus) — all those coordination drills finally pay off.</li></ul>", "backlinks": ["overview", "timeline", "threads", "session-3"], "search": "torr tor high elf tactician of the mastermind doctrine, raised among the wode elves. level 2."}, {"id": "urzel-the-radiant", "title": "Urzel the Radiant", "group": "Heroes", "type": "hero", "typeLabel": "Hero", "layout": "prose", "dek": "Orc conduit of the Life and Sun domains. Level 2.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Urzul"], "image": "", "html": "<h2>At a Glance</h2><ul><li><strong>Ancestry:</strong> Orc</li><li><strong>Class:</strong> Conduit — Life and Sun domains</li><li><strong>Career:</strong> Disciple</li><li><strong>Culture:</strong> Orc — wilderness, communal, creative upbringing</li><li><strong>Level:</strong> 2 · Wealth 1 · Renown 1</li></ul><h2>Characteristics</h2><ul><li><strong>Might</strong> 1 · <strong>Agility</strong> −1 · <strong>Reason</strong> 1 · <strong>Intuition</strong> 2 · <strong>Presence</strong> 2</li><li><strong>Stamina</strong> 30 (winded at 15) · <strong>Recoveries</strong> 8, recovering 10 Stamina each</li><li><strong>Speed</strong> 5 · <strong>Size</strong> 1M · <strong>Stability</strong> 2 · <strong>Disengage</strong> 1</li><li><strong>Heroic resource:</strong> Piety</li><li><strong>Prayer:</strong> Prayer of Steel · <strong>Ward:</strong> Bastion Ward (+1 to saving throws)</li><li><strong>Immunity:</strong> Slowed (Nonstop)</li></ul><h2>Inciting Incident — Dogma</h2><p>Urzel joined a religious institution under the guidance of a kind mentor, but others in the house of worship grew increasingly fanatical. The mentor tried to be a voice of reason, and was tried as a heretic and executed. Urzel left the institution and became a hero to uphold the beliefs they hold dear.</p><h2>Faith</h2><p>At the table Urzel calls his god a god of fire and light, and prays to a one-armed god whose name was heard as \"Gruul\". The spelling isn't confirmed yet.</p><h2>Languages</h2><p>Caelian, Kalliac.</p><h2>Skills</h2><p>Climb, Endurance, Jump, Perform, Persuade, Read Person, Criminal Underworld, Culture, Magic, Religion.</p><h2>Traits and Perks</h2><ul><li><strong>Relentless</strong> — when knocked to dying, make a free strike; dropping a foe lets Urzel spend a Recovery.</li><li><strong>Nonstop</strong> — immune to slowed. <strong>Grounded</strong> — +1 Stability.</li><li><strong>Ritualist</strong> — a one-minute blessing gives a double edge on the target's next test.</li></ul><h2>Class Features</h2><ul><li><strong>Prayer</strong> — pray for extra piety at the risk of angering the gods.</li><li><strong>The Lists of Heaven</strong> — healing an ally lets Urzel spend a Recovery too.</li><li><strong>Revitalizing Ritual</strong> and <strong>Inner Light</strong> — respite blessings that boost recoveries and saving throws.</li><li><strong>Healing Grace</strong> — divine energy restores the righteous.</li><li><strong>Ray of Wrath</strong> — a blast of holy light.</li><li><strong>Word of Guidance</strong> — invigorate an attacking ally with divine energy.</li></ul><h2>Abilities</h2><ul><li><strong>Blessed Light</strong> (signature) — burning radiance that shares the target's energy with an ally.</li><li><strong>Drain</strong> (signature) — drain a target's energy to revitalise yourself or an ally.</li><li><strong>Judgment's Hammer</strong> (3 Piety) — divine fury crashes down upon the unrighteous.</li><li><strong>Morning Light</strong> (5 Piety) — burn foes and bless allies.</li><li><strong>Faith Is Our Armor</strong> (5 Piety) — the heroes' armour glows with golden light.</li></ul>", "backlinks": ["ashgate-watch", "overview", "timeline", "threads", "session-1", "session-3", "the-cistern"], "search": "urzel the radiant urzul orc conduit of the life and sun domains. level 2."}, {"id": "annabel-swordbuck", "title": "Annabel Swordbuck", "group": "People", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "An elf smuggler whose hide the party cost her.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Annabelle"], "image": "", "html": "<p>An elf with a nasty habit of picking her teeth with a thin shard of bone. The party found her in her smuggler's hide in <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a> after escaping the <a class=\"wl\" href=\"#ashgate-watch\">Ashgate Watch</a>.</p><h2>Her Crew</h2><p>Three or four people who go by nicknames. Her right hand is a squat, gruff dwarf who cares more about her safety than about anything going on in the street.</p><h2>Session 3</h2><p>When the guard raided the hide, Annabel and her crew slipped out through a false door and left the party behind. The hide held months of smuggling work, including jewels, gems, weapons, drugs and booze, and the raid cost her all of it. She blames the party.</p><p>She told them that things are amiss in <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>: her people no longer trust the sewers, because every group they send down doesn't come back. Her price was for the party to get her crew through the sewers, and maybe then they could talk. She and her crew hung back while the party went into <a class=\"wl\" href=\"#the-cistern\">the Cistern</a>.</p>", "backlinks": ["ashgate-watch", "overview", "timeline", "threads", "session-2", "session-3"], "search": "annabel swordbuck annabelle an elf smuggler whose hide the party cost her."}, {"id": "broadhurst", "title": "Broadhurst", "group": "Places", "type": "place", "typeLabel": "Place", "layout": "prose", "dek": "Where the party set out from.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "image": "", "html": "<p>The party departed Broadhurst for <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a> at the start of Session 1.</p>", "backlinks": ["overview", "timeline", "sanctuary-city", "session-1"], "search": "broadhurst where the party set out from."}, {"id": "sanctuary-city", "title": "Sanctuary City", "group": "Places", "type": "place", "typeLabel": "Place", "layout": "prose", "dek": "The party's destination, now known to be under assault by demons.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "image": "", "html": "<p>The city the party travelled to from <a class=\"wl\" href=\"#broadhurst\">Broadhurst</a>. Refugees on the road were heading there in hope. The party was interrogated at its gates, and once inside found that something did not seem right.</p><p>The <a class=\"wl\" href=\"#ashgate-watch\">Ashgate Watch</a> operates there. <a class=\"wl\" href=\"#the-tail-and-claw\">The Tail and Claw</a> is in the city.</p><h2>Beneath the City</h2><p>The sewers are something the city's smugglers no longer trust, because groups sent down don't come back. In <a class=\"wl\" href=\"#session-3\">Session 3</a> the party found out why: <a class=\"wl\" href=\"#the-cistern\">a cistern</a> full of <a class=\"wl\" href=\"#demons\">Demons</a>. Sanctuary City is under assault by demons, which explains the empty sewers, the strange bodies being pulled out of the canals, and why everything in the city has gone astray.</p>", "backlinks": ["annabel-swordbuck", "ashgate-watch", "broadhurst", "overview", "timeline", "session-1", "session-2", "session-3", "the-cistern", "the-tail-and-claw"], "search": "sanctuary city the party's destination, now known to be under assault by demons."}, {"id": "the-cistern", "title": "The Cistern", "group": "Places", "type": "place", "typeLabel": "Place", "layout": "prose", "dek": "A sewer nexus beneath Sanctuary City, overrun by demons.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "image": "", "html": "<p>A large cistern at a junction of the sewers under <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>, crossed by boardwalks and a catwalk and full of knee-deep and deeper water. The party fought a horde of <a class=\"wl\" href=\"#demons\">Demons</a> here in <a class=\"wl\" href=\"#session-3\">Session 3</a>.</p><h2>What the Party Found</h2><ul><li><strong>The edge.</strong> At the centre, the water pours into a sinkhole that looks like a pit into another world. Bodies drift over it and vanish.</li><li><strong>The bodies.</strong> A ledge holds an enormous mound of corpses, apparently being prepared to go over the edge. <a class=\"wl\" href=\"#the-mawblade\">The Mawblade</a> was found among them.</li><li><strong>The controls.</strong> Sluice controls can close the grates and drain the cistern. <a class=\"wl\" href=\"#urzel-the-radiant\">Urzel</a> used them.</li></ul><p>A voice from the centre of the cistern ordered the demons to \"finish these fools\".</p>", "backlinks": ["annabel-swordbuck", "bendrak", "overview", "timeline", "demons", "fiktin", "frenzied", "threads", "pitling", "ruinant", "sanctuary-city", "session-3", "the-mawblade", "torlas"], "search": "the cistern a sewer nexus beneath sanctuary city, overrun by demons."}, {"id": "the-tail-and-claw", "title": "The Tail and Claw", "group": "Places", "type": "place", "typeLabel": "Place", "layout": "prose", "dek": "An inn in Sanctuary City.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": ["Tail and Claw Inn", "Tail and Claw"], "image": "", "html": "<p>The party found the Tail and Claw during Session 1 in <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>.</p>", "backlinks": ["timeline", "sanctuary-city", "session-1"], "search": "the tail and claw tail and claw inn tail and claw an inn in sanctuary city."}, {"id": "ashgate-watch", "title": "Ashgate Watch", "group": "Factions", "type": "faction", "typeLabel": "Faction", "layout": "prose", "dek": "A city watch in Sanctuary City. Now hunting the party.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": ["Ashgate Guard", "Ash Gate Guard"], "image": "", "html": "<p>The party murdered several members of the Ashgate Watch to sneak <a class=\"wl\" href=\"#urzel-the-radiant\">Urzel</a> into <a class=\"wl\" href=\"#sanctuary-city\">Sanctuary City</a>. Alarm bells followed, and the rest of the Watch was alerted. The party escaped them in the back alleys.</p><p>Members of the Watch have since been claiming they saw individuals with wings, and it frightened them. In <a class=\"wl\" href=\"#session-3\">Session 3</a> the guard raided <a class=\"wl\" href=\"#annabel-swordbuck\">Annabel</a>'s smuggler's hide while the party was inside.</p>", "backlinks": ["annabel-swordbuck", "overview", "timeline", "threads", "sanctuary-city", "session-1", "session-2", "session-3"], "search": "ashgate watch ashgate guard ash gate guard a city watch in sanctuary city. now hunting the party."}, {"id": "demons", "title": "Demons", "group": "Factions", "type": "faction", "typeLabel": "Faction", "layout": "prose", "dek": "The creatures overrunning the sewers beneath Sanctuary City.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "image": "", "html": "<p>The party's first encounter with demons was in <a class=\"wl\" href=\"#the-cistern\">the Cistern</a> in <a class=\"wl\" href=\"#session-3\">Session 3</a>. None of the heroes had faced one before.</p><p>Sanctuary City is under assault by demons. That is why no one goes into the sewers, why strange bodies are being pulled out of the canals, and why everything in the city has gone astray.</p><h2>What the Party Has Learned</h2><ul><li>They are weak to holy damage.</li><li>A demon that is badly hurt fights more desperately, and becomes easier to hit.</li><li>They answered to a voice from the centre of the cistern, which ordered them to \"finish these fools\".</li></ul><h2>Kinds Encountered</h2><ul><li><a class=\"wl\" href=\"#pitling\">Pitling</a></li><li><a class=\"wl\" href=\"#ruinant\">Ruinant</a></li><li><a class=\"wl\" href=\"#frenzied\">Frenzied</a></li><li><a class=\"wl\" href=\"#torlas\">Torlas</a></li><li><a class=\"wl\" href=\"#bendrak\">Bendrak</a></li><li><a class=\"wl\" href=\"#fiktin\">Fiktin</a></li></ul>", "backlinks": ["bendrak", "overview", "fiktin", "frenzied", "threads", "pitling", "ruinant", "sanctuary-city", "session-3", "the-cistern", "torlas"], "search": "demons the creatures overrunning the sewers beneath sanctuary city."}, {"id": "the-mawblade", "title": "The Mawblade", "group": "Things", "type": "thing", "typeLabel": "Item", "layout": "prose", "dek": "A black iron blade whose edge is lined with ivory teeth.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": ["More Blade"], "image": "", "html": "<p>Found in <a class=\"wl\" href=\"#the-cistern\">the Cistern</a> in <a class=\"wl\" href=\"#session-3\">Session 3</a>. It was wrapped in rags and kept apart from the other items and debris that were going over the edge with the bodies.</p><p>The Director has promised to tell the party more about it.</p>", "backlinks": ["overview", "threads", "session-3", "the-cistern"], "search": "the mawblade more blade a black iron blade whose edge is lined with ivory teeth."}, {"id": "bendrak", "title": "Bendrak", "group": "Bestiary", "type": "enemy", "typeLabel": "Monster", "layout": "prose", "dek": "A demon like a horse with a strange head, gems floating around its body.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Bendrax", "Bend Rack", "Bendrac", "Bandrack", "Bendrag", "Bendrick"], "image": "images/bendrak.png", "html": "<p>A <a class=\"wl\" href=\"#demons\">demon</a> that looks like a horse with a strange head, with gems floating around its body and a long, skinny neck. It hangs back behind cover and warps its victims' perceptions. Someone under its influence finds their blows turned partly onto their friends. It died in <a class=\"wl\" href=\"#the-cistern\">the Cistern</a> making one last attempt to bend <a class=\"wl\" href=\"#aurelion\">Aurelion</a>'s mind. Met in <a class=\"wl\" href=\"#session-3\">Session 3</a>.</p>", "backlinks": ["timeline", "demons", "session-3"], "search": "bendrak bendrax bend rack bendrac bandrack bendrag bendrick a demon like a horse with a strange head, gems floating around its body."}, {"id": "fiktin", "title": "Fiktin", "group": "Bestiary", "type": "enemy", "typeLabel": "Monster", "layout": "prose", "dek": "Humanoid demons of dripping, oily blood that disguise themselves as objects.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Fitkin", "Fitkins", "Ficton", "Fictons", "Ficken", "Fickens"], "image": "images/fiktin.png", "html": "<p>Humanoid in shape but made entirely of dripping, oily blood, solid only to a degree. Fiktins can transform into mundane objects: one waited underwater as a rock, and another burst out of the rags of a corpse. They were the strongest <a class=\"wl\" href=\"#demons\">Demons</a> the party had faced.</p><p>They rose from <a class=\"wl\" href=\"#the-cistern\">the Cistern</a> when a voice ordered the demons to \"finish these fools\", and they fought to the death. Met in <a class=\"wl\" href=\"#session-3\">Session 3</a>.</p>", "backlinks": ["timeline", "demons", "threads", "session-3"], "search": "fiktin fitkin fitkins ficton fictons ficken fickens humanoid demons of dripping, oily blood that disguise themselves as objects."}, {"id": "frenzied", "title": "Frenzied", "group": "Bestiary", "type": "enemy", "typeLabel": "Monster", "layout": "prose", "dek": "Fast demons with huge claws and many teeth.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "image": "images/frenzied.png", "html": "<p><a class=\"wl\" href=\"#demons\">Demons</a> that move very fast, especially with a <a class=\"wl\" href=\"#ruinant\">Ruinant</a> leading them, and have huge claws and lots of teeth. In <a class=\"wl\" href=\"#the-cistern\">the Cistern</a>, frenzied were seen to crack, bend and split open from within to become ruinants. Met in <a class=\"wl\" href=\"#session-3\">Session 3</a>.</p>", "backlinks": ["timeline", "demons", "ruinant", "session-3"], "search": "frenzied fast demons with huge claws and many teeth."}, {"id": "pitling", "title": "Pitling", "group": "Bestiary", "type": "enemy", "typeLabel": "Monster", "layout": "prose", "dek": "Stinking little demons with many tongues, spitting acid.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "image": "images/pitling.png", "html": "<p>Disgusting little <a class=\"wl\" href=\"#demons\">Demons</a> with multiple tongues and bodies split horrifically open. Their stench is enough to make you gag, and saliva dribbles from tongue to cheek. They fight in packs led by a <a class=\"wl\" href=\"#ruinant\">Ruinant</a>, spitting acid from range, and fall quickly when hit, but they stack up if ignored.</p><p>Met in <a class=\"wl\" href=\"#the-cistern\">the Cistern</a> in <a class=\"wl\" href=\"#session-3\">Session 3</a>. Some scampered off into the tunnels.</p>", "backlinks": ["timeline", "demons", "threads", "session-3"], "search": "pitling stinking little demons with many tongues, spitting acid."}, {"id": "ruinant", "title": "Ruinant", "group": "Bestiary", "type": "enemy", "typeLabel": "Monster", "layout": "prose", "dek": "Demon captains. Each pack has one.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Runant"], "image": "images/ruinant.png", "html": "<p>Not big, but a captain: each pack of lesser <a class=\"wl\" href=\"#demons\">Demons</a> has a ruinant directing it, and the pack fights harder while it lives. Ruinants sprint through water as if it isn't there and attack with bloodletting claws.</p><p>In <a class=\"wl\" href=\"#the-cistern\">the Cistern</a>, a <a class=\"wl\" href=\"#frenzied\">Frenzied</a> cracked and split from within to become a new ruinant, twice. One ruinant fled into the tunnels at the end of the fight. Met in <a class=\"wl\" href=\"#session-3\">Session 3</a>.</p>", "backlinks": ["timeline", "demons", "frenzied", "threads", "pitling", "session-3"], "search": "ruinant runant demon captains. each pack has one."}, {"id": "torlas", "title": "Torlas", "group": "Bestiary", "type": "enemy", "typeLabel": "Monster", "layout": "prose", "dek": "Demons that turn the ground to flesh and drag their prey through it.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Taulas", "Tall Ass", "Torilis"], "image": "images/torlas.png", "html": "<p><a class=\"wl\" href=\"#demons\">Demons</a> that turn an area of ground into spongy flesh, which tears at anyone forced to move through it. They pull targets towards them with grasping tendrils. In <a class=\"wl\" href=\"#the-cistern\">the Cistern</a>, two of them dragged <a class=\"wl\" href=\"#aurelion\">Aurelion</a> back and forth through the flesh and seemed to enjoy it. Met in <a class=\"wl\" href=\"#session-3\">Session 3</a>.</p>", "backlinks": ["timeline", "demons", "session-3"], "search": "torlas taulas tall ass torilis demons that turn the ground to flesh and drag their prey through it."}];

function renderPage(id){
  const p = byId[id];
  if(!p) return "<p>Page not found.</p>";
  let h = '<div class="crumb">' + p.group + '</div>';
  h += '<h1 class="ttl">' + p.title + '</h1>';
  if(p.dek) h += '<div class="dek">' + p.dek + '</div>';

  if(p.type !== "doc"){
    h += '<div class="badges"><span class="tag t-' + p.type + '">' + p.typeLabel + '</span>';
    if(p.player) h += '<span class="tag">Played by ' + p.player + '</span>';
    if(p.conf)   h += '<span class="tag"><span class="conf"><span class="dot ' + p.conf + '"></span>' + p.confLabel + '</span></span>';
    h += '</div>';
    if(p.aliases.length){
      h += '<div class="panel"><div class="ph">Also transcribed as</div><div>'
         + p.aliases.map(a => '<span class="alias">' + a + '</span>').join('')
         + '</div></div>';
    }
  }

  if(p.image) h += '<figure class="portrait"><img src="' + p.image + '" alt="' + p.title + '" loading="lazy"></figure>';
  h += '<div class="prose">' + p.html + '</div>';

  if(p.backlinks.length){
    h += '<div class="backlinks"><div class="ph">Mentioned in</div><ul>'
       + p.backlinks.map(b => '<li><a href="#' + b + '">' + TITLES[b] + '</a></li>').join('')
       + '</ul></div>';
  }

  h += '<div class="foot">Built from campaign records and session notes. Entity names carry every known spelling; '
     + 'anything marked <em>needs review</em> or <em>low confidence</em> is waiting on confirmation before it becomes canon. '
     + 'Built ' + BUILT + '.</div>';
  return h;
}

function renderNav(filter){
  const f = (filter || "").trim().toLowerCase();
  const groups = [];
  PAGES.forEach(p => {
    if(f && p.search.indexOf(f) === -1) return;
    let g = groups.find(x => x.name === p.group);
    if(!g){ g = {name:p.group, items:[]}; groups.push(g); }
    g.items.push(p);
  });
  if(!groups.length) return '<div style="padding:4px 20px;color:var(--muted);font-size:14px">Nothing matches.</div>';
  return groups.map(g =>
    '<div class="grp"><div class="lbl">' + g.name + '</div>'
    + g.items.map(p =>
        '<a href="#' + p.id + '"' + (p.id === current ? ' aria-current="page"' : '') + '>'
        + '<span>' + p.title + '</span>'
        + (p.type !== "doc" && p.backlinks.length ? '<span class="n">' + p.backlinks.length + '</span>' : '')
        + '</a>').join('')
    + '</div>').join('');
}

function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  current = byId[id] ? id : (PAGES.length ? PAGES[0].id : "");
  main.innerHTML = renderPage(current);
  nav.innerHTML = renderNav(q.value);
  document.title = (byId[current] ? byId[current].title + " · " : "") + "Sanctuary City";
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
q.addEventListener("input", function(){ nav.innerHTML = renderNav(q.value); });

document.getElementById("themebtn").addEventListener("click", function(){
  const root = document.documentElement;
  const now = root.getAttribute("data-theme");
  const dark = now ? now === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.setAttribute("data-theme", dark ? "light" : "dark");
  try { localStorage.setItem("ds-theme", dark ? "light" : "dark"); } catch(e){}
});
try {
  const saved = localStorage.getItem("ds-theme");
  if(saved) document.documentElement.setAttribute("data-theme", saved);
} catch(e){}

route();
</script>
</body>
</html>
